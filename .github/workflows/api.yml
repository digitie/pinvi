name: api

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'contracts/**'
      - '.github/workflows/api.yml'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'contracts/**'
      - '.github/workflows/api.yml'
  # T-VN-H07D: vendored 스냅샷이 kor-travel-map main보다 뒤처졌는지 매일 비차단으로 확인한다.
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

concurrency:
  # event를 key에 포함한다 — schedule/push 모두 refs/heads/main으로 평가돼 같은 그룹에 들어가면
  # 매일 도는 staleness run과 머지 후 run이 서로를 취소해 신호가 조용히 사라진다.
  group: api-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    # 예약 실행은 staleness 확인이 목적이라 전체 suite는 돌리지 않는다.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_USER: pinvi
          POSTGRES_PASSWORD: pinvi_ci_password
          POSTGRES_DB: pinvi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pinvi -d pinvi_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

      - name: mypy --strict
        run: mypy --strict app

      - name: pytest (unit)
        env:
          PINVI_JWT_SECRET_KEY: pinvi-ci-jwt-secret-32-bytes-minimum-aaaa
          PINVI_DATABASE_URL: postgresql+asyncpg://pinvi:pinvi_ci_password@localhost:5432/pinvi_ci
        run: pytest tests/unit -q

      - name: Alembic migration sanity (PostGIS 컨테이너에 실제 적용)
        env:
          PINVI_JWT_SECRET_KEY: pinvi-ci-jwt-secret-32-bytes-minimum-aaaa
          PINVI_DATABASE_URL: postgresql+asyncpg://pinvi:pinvi_ci_password@localhost:5432/pinvi_ci
        run: alembic upgrade head

      - name: pytest (integration)
        env:
          PINVI_JWT_SECRET_KEY: pinvi-ci-jwt-secret-32-bytes-minimum-aaaa
          PINVI_DATABASE_URL: postgresql+asyncpg://pinvi:pinvi_ci_password@localhost:5432/pinvi_ci
        run: pytest tests/integration -q

      - name: wheel install resolves the packaged Map service provenance
        run: |
          rm -rf /tmp/pinvi-api-wheel /tmp/pinvi-api-wheel-verify
          mkdir -p /tmp/pinvi-api-wheel
          python -m pip wheel --no-deps --wheel-dir /tmp/pinvi-api-wheel .
          python -m venv --system-site-packages /tmp/pinvi-api-wheel-verify
          /tmp/pinvi-api-wheel-verify/bin/pip install --no-deps --force-reinstall /tmp/pinvi-api-wheel/*.whl
          (
            cd /tmp
            /tmp/pinvi-api-wheel-verify/bin/python - <<'PY'
          from pathlib import Path

          import app.core.config as config

          assert Path(config.__file__).is_relative_to("/tmp/pinvi-api-wheel-verify")
          assert config.KOR_TRAVEL_MAP_SERVICE_OPENAPI_SHA256 == (
              "c878531af2acdea0a25861d81f2e87f4768244d8ff37b94cb610194e3db85c96"
          )
          assert config.KOR_TRAVEL_MAP_CACHE_TARGET_CAPABILITY_GENERATION == 7
          assert config.KOR_TRAVEL_MAP_C6C_CANCEL_PROBE_CAPABILITY_GENERATION == 2
          assert config.KOR_TRAVEL_MAP_CURATION_SNAPSHOT_CAPABILITY_GENERATION == 1
          assert config.KOR_TRAVEL_MAP_FEATURE_REQUEST_CAPABILITY_GENERATION == 1
          PY
          )

  docker-provenance-image:
    # 예약 실행은 staleness 확인만 수행한다. Docker image 검증은 변경 가능한 PR/push에서만 한다.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Docker image resolves the packaged Map service provenance
        run: |
          image="pinvi-api-provenance:${GITHUB_SHA}"
          docker build --file apps/api/Dockerfile --tag "${image}" .
          docker run --rm -i --entrypoint python "${image}" - <<'PY'
          import hashlib
          import json
          from importlib.resources import files
          from pathlib import Path

          import app.core.config as config

          artifact = files("app").joinpath(
              "_contract_data/kor-travel-map-service-provenance-v1.json"
          )
          assert artifact.is_file()
          payload = json.loads(artifact.read_text(encoding="utf-8"))
          assert hashlib.sha256(artifact.read_bytes()).hexdigest() == (
              "189850e224ba0744fcfd8ad32baf1d8539c6a2c5b4ed696e395b87012eb71b6b"
          )
          assert payload == {
              "capabilities": {
                  "cache_target": {"generation": 7},
                  "c6c_cancel_probe": {"generation": 2},
                  "curation_snapshot": {"generation": 1},
                  "feature_request": {"generation": 1},
              },
              "map_release_revision": config.KOR_TRAVEL_MAP_SERVICE_RELEASE_REVISION,
              "service_openapi_sha256": config.KOR_TRAVEL_MAP_SERVICE_OPENAPI_SHA256,
              "version": 1,
          }
          assert not Path("/contracts/kor-travel-map-service-provenance-v1.json").exists()
          PY

  # vendored Map 계약의 live-compare가 sibling 체크아웃 부재로 CI에서 skip되어 항상
  # green이던 맹점을 없앤다. kor-travel-map을 **핀 커밋**으로 체크아웃해 실제로 비교한다.
  #
  # 이름 주의: 이 job이 증명하는 것은 **핀↔vendored 자기정합**(수기 graft, 재-vendor 없이
  # 핀만 올린 경우를 잡는다)이지 "최신인가"가 아니다. 핀 자체가 뒤처졌는지는 구조상 알 수 없고,
  # 그건 아래 `contract-staleness`(Map main 비교)가 담당한다.
  contract-pin-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned kor-travel-map commits and service metadata
        id: pins
        run: |
          user_pin=$(grep -oP '_UPSTREAM_COMMIT = "\K[0-9a-f]{40}' \
            apps/api/tests/unit/test_kor_travel_map_contract.py)
          service_pin=$(python -c 'import json; print(json.load(open("contracts/kor-travel-map-service-provenance-v1.json"))["map_release_revision"])')
          service_sha=$(python -c 'import json; print(json.load(open("contracts/kor-travel-map-service-provenance-v1.json"))["service_openapi_sha256"])')
          service_generation=$(python -c 'import json; print(json.load(open("contracts/kor-travel-map-service-provenance-v1.json"))["capabilities"]["cache_target"]["generation"])')
          source_pin=$(grep -oP '_UPSTREAM_MAP_COMMIT = "\K[0-9a-f]{40}' \
            apps/api/tests/unit/test_cache_target_contract.py)
          alias_pin=$(grep -oP '_UPSTREAM_MAP_COMMIT = "\K[0-9a-f]{40}' \
            apps/api/tests/unit/test_feature_alias_contract.py)
          echo "user_pin=$user_pin" >> "$GITHUB_OUTPUT"
          echo "service_pin=$service_pin" >> "$GITHUB_OUTPUT"
          echo "service_sha=$service_sha" >> "$GITHUB_OUTPUT"
          echo "service_generation=$service_generation" >> "$GITHUB_OUTPUT"
          echo "source_pin=$source_pin" >> "$GITHUB_OUTPUT"
          echo "alias_pin=$alias_pin" >> "$GITHUB_OUTPUT"
          echo "user=$user_pin service=$service_pin source=$source_pin alias=$alias_pin"

      - name: service metadata and PinVi runtime contract are exact
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          from pathlib import Path

          metadata = json.loads(
              Path("contracts/kor-travel-map-service-provenance-v1.json").read_text()
          )
          assert metadata.keys() == {
              "capabilities",
              "map_release_revision",
              "service_openapi_sha256",
              "version",
          }
          assert metadata["version"] == 1
          assert re.fullmatch(r"[0-9a-f]{40}", metadata["map_release_revision"])
          assert re.fullmatch(r"[0-9a-f]{64}", metadata["service_openapi_sha256"])
          assert metadata["capabilities"] == {
              "cache_target": {"generation": 7},
              "c6c_cancel_probe": {"generation": 2},
              "curation_snapshot": {"generation": 1},
              "feature_request": {"generation": 1},
          }

          config = Path("apps/api/app/core/config.py").read_text()
          assert (
              '_SERVICE_PROVENANCE_FILENAME = "kor-travel-map-service-provenance-v1.json"'
              in config
          )
          assert "KOR_TRAVEL_MAP_SERVICE_OPENAPI_SHA256" in config
          assert "KOR_TRAVEL_MAP_CACHE_TARGET_CAPABILITY_GENERATION" in config
          assert "KOR_TRAVEL_MAP_C6C_CANCEL_PROBE_CAPABILITY_GENERATION" in config
          assert "KOR_TRAVEL_MAP_CURATION_SNAPSHOT_CAPABILITY_GENERATION" in config
          assert "KOR_TRAVEL_MAP_FEATURE_REQUEST_CAPABILITY_GENERATION" in config
          assert "cache-target-upstream-map-v1.json" not in config
          snapshot = Path("apps/api/tests/contract/kor-travel-map-openapi-service.json").read_bytes()
          assert hashlib.sha256(snapshot).hexdigest() == metadata["service_openapi_sha256"]
          dockerfile = Path("apps/api/Dockerfile").read_text()
          assert (
              "COPY contracts/kor-travel-map-service-provenance-v1.json "
              "./app/_contract_data/kor-travel-map-service-provenance-v1.json"
          ) in dockerfile
          pyproject = Path("apps/api/pyproject.toml").read_text()
          assert (
              '"../../contracts/kor-travel-map-service-provenance-v1.json" = '
              '"app/_contract_data/kor-travel-map-service-provenance-v1.json"'
          ) in pyproject
          PY

      - name: Checkout kor-travel-map at the user-surface pin
        uses: actions/checkout@v4
        with:
          repository: digitie/kor-travel-map
          ref: ${{ steps.pins.outputs.user_pin }}
          path: .ktm-user-pin

      - name: Checkout kor-travel-map at the service-surface pin
        uses: actions/checkout@v4
        with:
          repository: digitie/kor-travel-map
          ref: ${{ steps.pins.outputs.service_pin }}
          path: .ktm-service-pin

      - name: Checkout kor-travel-map at the cache-target source pin
        uses: actions/checkout@v4
        with:
          repository: digitie/kor-travel-map
          ref: ${{ steps.pins.outputs.source_pin }}
          path: .ktm-cache-target-source-pin

      - name: Checkout kor-travel-map at the feature-alias-map pin
        uses: actions/checkout@v4
        with:
          repository: digitie/kor-travel-map
          ref: ${{ steps.pins.outputs.alias_pin }}
          path: .ktm-feature-alias-pin

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # user 표면: vendored 전체 파일이 핀 커밋 원본과 byte 동일해야 한다.
      - name: user snapshot byte equality vs pinned commit
        run: |
          diff -q \
            apps/api/tests/contract/kor-travel-map-openapi-user.json \
            .ktm-user-pin/packages/kor-travel-map-api/openapi.user.json

      - name: service snapshot byte equality vs pinned commit
        run: |
          diff -q \
            apps/api/tests/contract/kor-travel-map-openapi-service.json \
            .ktm-service-pin/packages/kor-travel-map-api/openapi.service.json

      - name: cache-target source bytes equal the pinned commit
        run: |
          diff -q \
            apps/api/tests/contract/cache-target-source-v1-golden.json \
            .ktm-cache-target-source-pin/contracts/cache-target-source-v1-golden.json

      # T-VN-32C: alias-map golden은 양 저장소 독립 구현이 같은 shared vector를
      # 검증한다 — vendored bytes가 핀 커밋 원본과 byte 동일해야 한다.
      - name: feature-alias-map golden bytes equal the pinned commit
        run: |
          diff -q \
            apps/api/tests/contract/feature-alias-map-v1-golden.json \
            .ktm-feature-alias-pin/contracts/feature-alias-map-v1-golden.json

  # staleness 신호: 핀이 Map main보다 뒤처졌는지 매일 확인한다. `if:` 가드로 PR/push에는 아예
  # 돌지 않으므로 PR을 막지 않는다(막으면 Map의 무관한 OpenAPI 변경마다 Pinvi PR이 red가 된다).
  # `continue-on-error`는 쓰지 않는다 — job을 실패로 남겨야 예약 workflow 실패 알림이 가고,
  # H07B에서 스냅샷이 174 commits 뒤처진 걸 뒤늦게 발견한 종류의 드리프트가 실제로 사람에게 닿는다.
  contract-staleness:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: digitie/kor-travel-map
          ref: main
          path: .ktm-main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Report vendored-vs-main drift
        run: |
          status=0
          if ! diff -q apps/api/tests/contract/kor-travel-map-openapi-user.json \
                       .ktm-main/packages/kor-travel-map-api/openapi.user.json; then
            echo "::warning::user 스냅샷이 kor-travel-map main과 다르다 — 재-vendor 필요"
            status=1
          fi
          if ! diff -q apps/api/tests/contract/kor-travel-map-openapi-service.json \
                       .ktm-main/packages/kor-travel-map-api/openapi.service.json; then
            echo "::warning::service 스냅샷이 kor-travel-map main과 다르다 — 재-vendor 필요"
            status=1
          fi
          # T-VN-32C: shared golden 2종도 같은 드리프트 감시에 넣는다 — Map이 벡터를
          # 개정(예: 0083 nonderived_v1 추가)했는데 PinVi가 옛 사본으로 검증하는 맹점 방지.
          if ! diff -q apps/api/tests/contract/feature-alias-map-v1-golden.json \
                       .ktm-main/contracts/feature-alias-map-v1-golden.json; then
            echo "::warning::feature-alias-map golden이 kor-travel-map main과 다르다 — 재-vendor 필요"
            status=1
          fi
          if ! diff -q apps/api/tests/contract/cache-target-source-v1-golden.json \
                       .ktm-main/contracts/cache-target-source-v1-golden.json; then
            echo "::warning::cache-target-source golden이 kor-travel-map main과 다르다 — 재-vendor 필요"
            status=1
          fi
          if [ "$status" = 0 ]; then
            echo "vendored 스냅샷이 kor-travel-map main과 일치한다"
          fi
          exit "$status"
