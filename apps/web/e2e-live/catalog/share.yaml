    - 로그아웃 — 두 링크 200, '공유된 여행 · 댓글 가능/편집 가능', 댓글 영역 + 로그인 필요 안내, 편집 폼은 편집 링크에만
    - 로그인 — 편집 링크 저장 '여행 정보를 저장했습니다.', 댓글 링크 제목 반영·편집 폼 없음, 댓글 작성/삭제 성공
  cleanup:
