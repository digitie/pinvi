  priority: P2
  tags: [desktop, nearby]
  preconditions:
    - account: test@test.com (user)
    - env: 가격 이력은 upstream(transport→Map)에서 현재 꺼져 있음(coordinator 2026-11-03) → prod 기대 분기는 unavailable/disabled
  data_sources: [transport:gas]
  steps:
    - NEAR-004처럼 주유소 상세 열기 → '가격 추이 보기'
  expected:
    - GET …/price-history?days=30 200 (unavailable은 오류가 아님 — docs/api/transport.md)
    - "현재 prod: status=unavailable → transport-price-history-unavailable, data-reason=응답 reason(예 disabled), 문구 '가격 추이는 아직 제공되지 않습니다.'"
    - reason이 upstream_timeout/upstream_unavailable이면 '잠시 후 다시 시도해 주세요'
    - 이력이 켜지면 status=available & items>0 → transport-price-history에 '원' 행(같은 스크립트가 분기)
    - "'가격 추이를 불러오지 못했습니다.' 없음"
  cleanup: []
  automation: scripted
  spec: specs/nearby/transport-detail.live.spec.ts#NEAR-005

