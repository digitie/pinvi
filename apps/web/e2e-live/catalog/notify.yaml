- id: NTF-001
  title: 설정 > Telegram 알림 진입 — 탭·안내문·Chat ID 폼 라벨·그룹 경고 표시
  priority: P1
  tags: [desktop, mobile, telegram, a11y]
  preconditions:
    - account: test@test.com (user)
  data_sources: [pinvi:telegram-targets]
  steps:
    - 로그인 → 설정 → 'Telegram 알림' 탭(data-testid settings-tab-telegram)
  expected:
    - h1 'Telegram 알림', 안내문 'Pinvi 봇을 chat에 추가한 뒤 …', 경고 '그룹/채널을 연결하면 …'
    - "섹션 '새 대상 연결'/'연결된 대상', label 'Chat ID'↔input 연결, hint '예: -1001234567890 (그룹) 또는 123456789 (개인)'"
    - "'기본 대상' 체크 기본 on, 오류 alert 없음"
  cleanup:
    - "없음(읽기 전용)"
  automation: scripted
  spec: specs/notify/notify-settings.live.spec.ts#NTF-001

