# NEAR — nearby / transport information around trip places and on the explore map.
# PinVi main b1cef056 (PR #619, 2026-11-03). 41 cases: 35 scripted, 2 manual, 4 blocked.
# Prod facts assumed: PINVI_KOR_TRAVEL_MAP_TRANSPORT_ENABLED=true, all four layers available
# (handoff 2026-10-26: fuel/rest/incident/airport). Explore map default = 서울시청, zoom 12.
# 2026-11-16: 지도에서 공항·휴게소를 뺐고(NEAR-006·009 blocked), 교통 레이어는 경로·영역과 같은 패널의
# 체크박스다. 여행 지도는 여행 장소 반경(주유소 10 km·교통 돌발 20 km, /transport/markers-near).
# 2026-11-27: 쓰임이 적은 경로·영역 체크박스를 뺐다 — 패널은 주유소·교통 돌발 둘이다(교통 기능이 꺼지면 패널 없음).

- id: NEAR-001
  title: 탐색 지도 레이어 패널 — 체크박스 2개(주유소·교통 돌발) 순서·경로·영역 없음·교통 초기 꺼짐·요청 없음
  priority: P1
  tags: [desktop, mobile, nearby]
  preconditions:
    - account: test@test.com (user)
    - env: prod /transport/status enabled=true
  data_sources: [transport:status]
  steps:
    - 로그인 → '지도' → /map
    - /transport/status 응답 대기, 지도 레이어 패널(map-layer-controls) 표시 확인
  expected:
    - role=group '지도 레이어 표시' 안 label 텍스트가 정확히 [주유소, 교통 돌발] 순, 모두 checkbox, geometry-route/area-toggle 0개
    - 별도 '교통 정보' 제목 없음
    - 교통 체크박스 모두 꺼짐, 레이어 상태 줄·마커 legend 없음
    - 켜기 전 markers-in-bounds 요청 0건
  cleanup: []
  automation: scripted
  spec: specs/nearby/explore-panel.live.spec.ts#NEAR-001
  notes: '2026-11-16 소유자 결정: 공항·휴게소를 지도에서 빼고, 교통 레이어를 경로·영역과 같은 패널의 체크박스로 합쳤다(여행 지도는 여행 장소 반경).'

