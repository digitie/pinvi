  data_sources: [pinvi:trips, pinvi:telegram-outbox, telegram:sendMessage, pinvi:admin-api-calls]
  steps:
    - "대상 '[e2e] NTF-012'(기본) 등록 → 여행 '[e2e] NTF-012 …', 날짜 +30~+32일, 지역 '부산' 저장"
