# Trip scenarios — 제주 + 전국 테마 (TRS-JT). Data-driven: specs/trip-scenarios/scenarios.live.spec.ts
# Schema + loader: e2e-live/helpers/tripScenarios.ts (strict subset of YAML; the loader rejects anything else).
# Every place was validated read-only against prod PinVi GET /search (test user) on 2026-11-08:
# the first Map feature row (badge 장소) whose name contains expect_name_contains was within the top 3.
# Tag `mobile` = also runs under the mobile project. Titles get "[e2e] <id>" at runtime.

- id: TRS-JT-001
  title: "성산·우도 1박2일 — 일출봉·우도 도항·해녀의집"
  style: island
  days: 2
  start_offset_days: 3
  priority: P1
  tags: [heritage, nature, lodging, parking, food, mobile]
  places:
    - {day: 1, query: "성산일출봉", expect_name_contains: "성산일출봉", family: heritage, source: feature}
    - {day: 1, query: "섭지코지", expect_name_contains: "섭지코지", family: nature, source: feature}
