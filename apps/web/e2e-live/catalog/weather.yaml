- id: WX-001
  title: 오늘~모레 여행 1일차 '날짜 날씨'에 현재·예보(초단기/단기) 그룹 표시
  priority: P1
  tags: [desktop, mutating, weather]
  preconditions:
    - account: test@test.com (user)
    - data: Map has 안동하회마을 feature (heritage)
    - env: PINVI_KOR_TRAVEL_MAP_WEATHER_ENABLED=true (weather via Map REST); KMA ultra_short/short datasets loaded
  data_sources: [map:heritage, weather:map-rest]
  steps:
    - 여행 목록 → '새 여행' → 제목 '[e2e] WX-001 …', 날짜 D~D+2 → 저장
    - 1일차에 '안동하회마을' 검색 → 첫 결과 추가 → 새로고침
    - 1일차 탭 선택 → '날짜 날씨' 섹션 확인
  expected:
    - GET /trips/{id} 의 days[0].weather_by_feature_id[feature] 가 state=found
    - 1일차 섹션 data-testid=trip-weather-summary, 그룹 '현재' 또는 '예보' 표시(둘 다면 soft 통과)
    - '날씨 서비스를 일시적으로 사용할 수 없습니다.' 미표시
  cleanup:
    - 생성한 여행 삭제 → 목록에서 사라짐 확인 (afterEach, 실패 시에도)
  automation: scripted
  spec: specs/weather/weather-trip-days.live.spec.ts#WX-001
  notes: 첫 POI 기준으로 '날짜 날씨'가 뜬다(TripDetail.tsx day.pois[0]).

