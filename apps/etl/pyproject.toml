[project]
name = "pinvi-etl"
version = "0.1.0"
description = "Pinvi Dagster code location — Sprint 5에서 본격 활성화 (ADR-006)."
requires-python = ">=3.12"

dependencies = [
  "dagster>=1.9",
  "dagster-webserver>=1.9",
  # instance storage를 PostgreSQL로 둔다(`apps/etl/dagster.yaml`).
  # 이 패키지가 없으면 Dagster가 조용히 SQLite로 떨어지고, 그 SQLite는
  # DAGSTER_HOME에 볼륨이 없어 컨테이너 재생성마다 사라진다.
  "dagster-postgres>=0.25",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "httpx>=0.27",
  "python-kasi-api @ git+https://github.com/digitie/python-kasi-api.git@bc8fd49349212f840f58fe1a602bf77b2aaa1669",
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["pinvi"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.dagster]
module_name = "pinvi.etl.definitions"
