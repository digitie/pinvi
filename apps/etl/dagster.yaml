# Dagster instance 설정.
#
# 이 파일이 없어서 무엇이 되어 있었나 (2026-09-19 n150 실측):
#
#     run_storage       SqliteRunStorage
#     event_storage     SqliteEventLogStorage
#     schedule_storage  SqliteScheduleStorage
#     run_coordinator   QueuedRunCoordinator
#     run_launcher      DefaultRunLauncher
#     run_monitoring    False
#     총 run: 0
#
# 세 가지가 한꺼번에 잘못돼 있었다.
#
# 1. **SQLite가 컨테이너 안에 있었다.** `DAGSTER_HOME`(/opt/pinvi/.dagster)에
#    볼륨이 없어(`docker inspect` → `MOUNTS=[]`) 컨테이너가 재생성될 때마다 run
#    이력·schedule 켜짐 상태·sensor 커서가 통째로 사라진다. schedule의 on/off는
#    코드가 아니라 **storage**에 있으므로, 켜 두어도 다음 배포에서 꺼진다.
#
# 2. **`QueuedRunCoordinator`인데 dequeue하는 daemon이 없었다.** 이 조합은
#    "schedule이 안 돈다"가 아니라 **아무 run도 시작되지 않는다**는 뜻이다 —
#    UI에서 손으로 띄워도 QUEUED에서 멈춘다. 실측 run 0건이 그 결과다.
#    등록된 job 8개(`pinvi_pii_retention` 포함)와 schedule 7개, sensor 1개가
#    전부 한 번도 실행된 적이 없다.
#
# 3. **`run_monitoring`이 꺼져 있었다.** 형제 프로젝트 `kor-travel-weather`가
#    같은 호스트에서 이것 때문에 수집을 두 번 잃었고 두 번째는 18시간이었다.
#    프로세스가 사라진 run이 영원히 STARTED로 남아 `max_concurrent_runs`를
#    채우면, daemon은 "won't launch more"만 찍고 아무도 알아차리지 못한다.
#
# storage를 PostgreSQL로 옮기는 것은 볼륨을 붙이는 것보다 **덜** 임시적이어서가
# 아니라, SQLite가 동시 writer를 한 명만 받기 때문이다. daemon과 run worker가
# 동시에 쓰면 `database is locked`가 나고, RUN_SUCCESS 이벤트가 그 경쟁에서 지면
# 그 run은 **성공했는데 STARTED로 남는다.**
#
# **앱 DB가 아니라 별도 database(`pinvi_dagster`)를 쓴다.** dagster-postgres는
# 자기 스키마 이력을 `alembic_version`이라는 이름의 테이블로 관리하므로, PinVi
# 자신의 `alembic_version`과 같은 database를 쓰면 충돌한다. 인스턴스는 같은
# `pinvi-postgres`(:12800)를 쓰되 database만 가른다.

# 셋(run / event log / schedule)을 한 블록으로 설정한다. 따로 쓰면 셋 중 하나만
# 옮기는 실수가 가능하고, 그 상태는 "일부는 postgres, 일부는 SQLite"라 가장
# 나쁘다. `kor-travel-map`도 같은 shorthand를 쓴다.
storage:
  postgres:
    postgres_url:
      env: PINVI_DAGSTER_PG_URL
    # **`should_autocreate_tables`를 끄지 않는다 — Map과 다르다.**
    #
    # Map은 permit으로 게이트된 one-shot migration(`ktm-dagster-storage`)이
    # 따로 있어서, runtime이 누락 table을 암묵 생성하면 그 one-shot이 불완전했다는
    # 사실을 가린다. PinVi에는 그 기계가 없다. 여기서 끄면 첫 기동이 빈 DB에서
    # 아무것도 못 하고 죽을 뿐이고, 그것을 풀려고 PinVi에 permit 기계를 새로
    # 들이는 것은 이 변경의 목적이 아니다.

run_monitoring:
  enabled: true

  # 배포가 컨테이너를 교체하는 동안 run은 잠깐 응답이 없어 보인다. 건강한 run을
  # 배포 중에 죽이지 않을 만큼 길고, 멈춘 schedule을 한 주기 안에 알아차릴 만큼
  # 짧게 둔다.
  start_timeout_seconds: 300
  poll_interval_seconds: 60

  # 재개하지 않는다. 여기 job은 대부분 멱등이 아니라 **바깥으로 나가는 것**이다
  # (email outbox, telegram outbox). 사라진 run을 되살리면 같은 메시지를 두 번
  # 보낼 수 있다 — 실패로 끝내고 다음 schedule이 집게 한다.
  max_resume_run_attempts: 0

  # **왜 이 숫자인가.** 위의 liveness 검사는 *프로세스가 사라진* run만 잡는다.
  # 살아 있으면서 소켓 read 하나에 끼인 프로세스는 일하는 것과 구별되지 않아
  # 아무것도 그것을 끝내지 못한다. 이 값만이 "왜 멈췄는지"를 묻지 않는다.
  #
  # PinVi에는 **측정된 run이 0건**이므로 실측에서 유도할 수 없다. 대신 schedule
  # 주기에서 유도한다 — 가장 잦은 것이 15분 간격(email/telegram outbox)이고
  # 20분(trip day rise/set)이 뒤따른다. 한 시간을 넘긴 run은 이미 자기 주기를
  # 네 번 놓친 것이므로 병리적이다.
  #
  # **이력이 쌓이면 실측으로 다시 잡을 것.** 지금 값은 "아무 상한도 없는 것보다
  # 낫다"는 뜻이지 "이 job들이 한 시간 걸린다"는 뜻이 아니다. 개별 job은
  # `dagster/max_runtime` 태그로 따로 넘길 수 있다.
  max_runtime_seconds: 3600

# 기본값(10)을 그대로 둔다. 등록된 job이 8개이고 그중 셋만 15~20분 간격이라
# 동시 10개가 좁은 자리가 아니다. 좁아지면 그때 실측으로 조인다.
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator

telemetry:
  enabled: false
