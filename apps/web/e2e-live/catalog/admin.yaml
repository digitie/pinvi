- id: ADM-033
  title: 부정: Map 범위(lat ≤ 39.5) 밖 좌표 제안을 승인하면 422 와 명확한 문구, 상태는 그대로 '대기'
  priority: P1
  tags: [desktop, admin, mutating, poi]
  preconditions:
    - env: PINVI_E2E_ALLOW_RESIDUAL_SUGGESTIONS=1
  data_sources: [map:service-feature-requests]
  steps:
    - user: /map?suggest=128.0,41.0 (PinVi Coord 는 lat 33..43 허용, Map 큐는 33..39.5) → '[e2e] ADM-033 범위밖 <tag>' 제안
    - admin: 검토 → 사유 '[e2e] ADM-033' → 승인
  expected:
    - admin-fr-panel-error(role=alert) 에 'Map 요청 큐 범위를 벗어난 기존 제안입니다. 거절 후 새 제안으로 접수하세요.'
    - /approve 응답 422, error.code MAP_FEATURE_REQUEST_PAYLOAD_INVALID, Map 으로 가는 호출 없음(validate_submission 이 먼저 실패)
    - 다이얼로그 닫은 뒤 '대기' 목록에 행이 그대로 있다
  cleanup:
    - 같은 테스트 끝에서 거절(사유 '[e2e] cleanup') — rejected 행 잔존
  automation: scripted
  spec: specs/admin/admin-promotion.live.spec.ts#ADM-033
  notes: '카테고리 누락' 은 PinVi 승인 단계에서 거절 사유가 아니다(categories 선택 입력, 8자리 분류는 Map 운영자가 승인 시 지정). 좌표 누락은 생성 자체가 불가(dialog/API 모두 coord 필수). 따라서 PinVi 에서 검증 가능한 '명확한 거절' 은 Map 좌표 범위 위반뿐이다.
  # 2026-11-03 prod: #614 이후 FeatureRequestCreateSchema 가 new_place lat > 39.5 를 클라이언트에서 거부 — UI 로는 범위 밖 제안을 만들 수 없다. ADM-033 은 클라이언트 거부(요청 0건)를 단언하고, 승인 시 422 경로는 레거시 행 id(PINVI_E2E_LEGACY_OUT_OF_RANGE_ID)가 있을 때만 ADM-033b 로 검증. 잔여 rejected 제안은 run 당 2건으로 줄었다.

