# Pinvi app smoke compose — API + Web + Postgres + RustFS.
# `docs/runbooks/docker-app.md`.

services:
  app-postgres:
    image: postgis/postgis:16-3.5-alpine
    environment:
      # root-only bootstrap/extension owner. ordinary app containers never receive this login.
      POSTGRES_USER: ${PINVI_DB_OWNER_USER:-pinvi_owner}
      # smoke 기본값 — 운영은 infra/.env.prod 로 owner URL과 함께 override한다.
      POSTGRES_PASSWORD: ${PINVI_POSTGRES_PASSWORD:-pinvi_app_smoke}
      POSTGRES_DB: pinvi
    volumes:
      - app-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PINVI_DB_OWNER_USER:-pinvi_owner} -d pinvi"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Root bootstrap이 한 번만 만드는 non-owner/non-superuser runtime login과 Alembic role
  # topology다. ordinary runtime에는 migrator/owner login을 전달하지 않는다.
  # M05 evidence trigger는 runtime login이 ALTER TABLE로 비활성화할 수 없어야 한다.
  app-db-runtime-role:
    image: postgis/postgis:16-3.5-alpine
    restart: "no"
    depends_on:
      app-postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${PINVI_DB_OWNER_USER:-pinvi_owner}
      POSTGRES_PASSWORD: ${PINVI_POSTGRES_PASSWORD:-pinvi_app_smoke}
      POSTGRES_DB: pinvi
      PINVI_APP_DB_USER: ${PINVI_APP_DB_USER:-pinvi_app}
      PINVI_APP_DB_PASSWORD: ${PINVI_APP_DB_PASSWORD:-pinvi_app_smoke}
      PINVI_APP_SCHEMA_OWNER: ${PINVI_APP_SCHEMA_OWNER:-pinvi_app_owner}
      PINVI_MIGRATION_OWNER: ${PINVI_MIGRATION_OWNER:-pinvi_migration_owner}
      PINVI_MIGRATOR_DB_USER: ${PINVI_MIGRATOR_DB_USER:-pinvi_migrator}
      PINVI_MIGRATOR_DB_PASSWORD: ${PINVI_MIGRATOR_DB_PASSWORD:-pinvi_app_smoke}
      # Compose의 보통 재기동은 migrator를 절대 열지 않는다. migration wrapper만 -e로 0을 준다.
      PINVI_MIGRATOR_DISABLE_LOGIN: "1"
      # legacy profile은 root-only service로만 실행한다. 일반 role bootstrap은 legacy ownership을 받지 않는다.
      PINVI_M05_LEGACY_REBASELINE: "0"
    volumes:
      - ./postgres/bootstrap-pinvi-runtime-role.sh:/bootstrap/bootstrap-pinvi-runtime-role.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap-pinvi-runtime-role.sh"]

  app-rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "${PINVI_RUSTFS_PORT:-12101}:9000"
      - "${PINVI_RUSTFS_CONSOLE_PORT:-12105}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-rustfs-init:
    image: minio/mc:latest
    depends_on:
      app-rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://app-rustfs:9000 rustfsadmin rustfsadmin;
      mc mb -p local/pinvi-media || true;
      "

  app-api:
    build:
      # immutable 환경의 wrapper는 exact commit `git archive` 임시 디렉터리로 override한다.
      context: ${PINVI_API_BUILD_CONTEXT:-..}
      dockerfile: apps/api/Dockerfile
      args:
        # wrapper는 immutable 환경에서 clean HEAD를 PINVI_SOURCE_REVISION으로 export한다.
        # 직접 compose build를 실행해도 production + 누락/development 조합은 Dockerfile이 거부한다.
        - PINVI_SOURCE_REVISION
        - PINVI_BUILD_ENVIRONMENT=${PINVI_ENVIRONMENT:-smoke}
    image: ${PINVI_API_IMAGE:-pinvi-api:local}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app-postgres:
        condition: service_healthy
      app-db-runtime-role:
        condition: service_completed_successfully
      app-rustfs:
        condition: service_healthy
    environment:
      # smoke 기본값 — 운영은 infra/.env.prod 의 ${...} override 로 도메인/시크릿 주입(ADR-047).
      # 내부 endpoint(app-rustfs:9000)는 compose 내부망이라 override 대상 아님.
      PINVI_ENVIRONMENT: ${PINVI_ENVIRONMENT:-smoke}
      # non-owner application login only. Migration/restore use dedicated one-shot inputs.
      PINVI_DATABASE_URL: ${PINVI_DATABASE_URL:-postgresql+asyncpg://pinvi_app:pinvi_app_smoke@app-postgres:5432/pinvi}
      # ordinary API에는 raw dump를 mount하지 않는다. strict 환경의 snapshot 목록은
      # root producer가 만드는 metadata-only catalog로만 표시한다.
      PINVI_BACKUP_DIR: /var/lib/pinvi/backup-catalog
      PINVI_BACKUP_SCRIPT_PATH: ${PINVI_BACKUP_SCRIPT_PATH:-scripts/backup-db.sh}
      PINVI_RESTORE_SCRIPT_PATH: ${PINVI_RESTORE_SCRIPT_PATH:-scripts/restore-db.sh}
      PINVI_RESTORE_HOTSWAP_SCRIPT_PATH: ${PINVI_RESTORE_HOTSWAP_SCRIPT_PATH:-scripts/restore-hotswap.sh}
      PINVI_RESTORE_TIMEOUT_SECONDS: ${PINVI_RESTORE_TIMEOUT_SECONDS:-3600}
      # app-api에는 non-owner runtime URL만 둔다. schema-owner/fence URL과 execute
      # authority는 root-owned one-shot restore runner에만 주며, strict 환경의 API
      # restore 요청은 audit 가능한 fail-closed 응답으로 끝낸다.
      # API는 서명된 runtime attestation만 읽는다. Docker Engine socket은 API에 주지 않는다.
      PINVI_M05_RUNTIME_LIVE_CHECK: ${PINVI_M05_RUNTIME_LIVE_CHECK:-false}
      PINVI_JWT_SECRET_KEY: ${PINVI_JWT_SECRET_KEY:-pinvi-smoke-jwt-secret-32-bytes-minimum}
      PINVI_MCP_JWT_SECRET: ${PINVI_MCP_JWT_SECRET:-pinvi-smoke-jwt-secret-32-bytes-minimum}
      PINVI_RESEND_API_KEY: ${PINVI_RESEND_API_KEY:-}
      PINVI_WEB_BASE_URL: ${PINVI_WEB_BASE_URL:-http://127.0.0.1:12805}
      PINVI_GOOGLE_OAUTH_CLIENT_ID: ${PINVI_GOOGLE_OAUTH_CLIENT_ID:-}
      PINVI_GOOGLE_OAUTH_CLIENT_SECRET: ${PINVI_GOOGLE_OAUTH_CLIENT_SECRET:-}
      PINVI_OAUTH_CALLBACK_BASE_URL: ${PINVI_OAUTH_CALLBACK_BASE_URL:-http://127.0.0.1:12801}
      PINVI_RUSTFS_ENDPOINT_URL: http://app-rustfs:9000
      PINVI_RUSTFS_PUBLIC_ENDPOINT_URL: ${PINVI_RUSTFS_PUBLIC_ENDPOINT_URL:-http://127.0.0.1:12101}
      PINVI_RUSTFS_PUBLIC_BASE_URL: ${PINVI_RUSTFS_PUBLIC_BASE_URL:-}
      PINVI_RUSTFS_BUCKET: pinvi-media
      PINVI_RUSTFS_ACCESS_KEY_ID: ${PINVI_RUSTFS_ACCESS_KEY_ID:-rustfsadmin}
      PINVI_RUSTFS_SECRET_ACCESS_KEY: ${PINVI_RUSTFS_SECRET_ACCESS_KEY:-rustfsadmin}
      PINVI_CORS_ALLOWED_ORIGINS: '${PINVI_CORS_ALLOWED_ORIGINS:-["http://127.0.0.1:12805"]}'
      PINVI_GEOFENCE_ENABLED: ${PINVI_GEOFENCE_ENABLED:-false}
      PINVI_GEOFENCE_ALLOWED_COUNTRIES: '${PINVI_GEOFENCE_ALLOWED_COUNTRIES:-["KR"]}'
      PINVI_GEOFENCE_COUNTRY_HEADER: ${PINVI_GEOFENCE_COUNTRY_HEADER:-CF-IPCountry}
      PINVI_GEOFENCE_TRUSTED_PROXY_HEADER: ${PINVI_GEOFENCE_TRUSTED_PROXY_HEADER:-X-Pinvi-Geofence-Proxy}
      PINVI_GEOFENCE_TRUSTED_PROXY_SECRET: ${PINVI_GEOFENCE_TRUSTED_PROXY_SECRET:-}
      PINVI_GEOFENCE_TRUSTED_PROXY_CIDRS: '${PINVI_GEOFENCE_TRUSTED_PROXY_CIDRS:-[]}'
      PINVI_GEOFENCE_MTLS_VERIFIED_HEADER: ${PINVI_GEOFENCE_MTLS_VERIFIED_HEADER:-}
      PINVI_GEOFENCE_MTLS_VERIFIED_VALUE: ${PINVI_GEOFENCE_MTLS_VERIFIED_VALUE:-SUCCESS}
      PINVI_GEOFENCE_BLOCK_UNKNOWN: ${PINVI_GEOFENCE_BLOCK_UNKNOWN:-false}
      PINVI_GEOFENCE_BYPASS_PATHS: '${PINVI_GEOFENCE_BYPASS_PATHS:-["/health","/health/db","/metrics","/docs","/redoc","/openapi.json"]}'
      PINVI_SENTRY_ENVIRONMENT: ${PINVI_SENTRY_ENVIRONMENT:-smoke}
      PINVI_RATE_LIMIT_BACKEND: ${PINVI_RATE_LIMIT_BACKEND:-auto}
      # user-facing read는 service token 우선, public route만 전용 API key header fallback을 쓴다.
      PINVI_KOR_TRAVEL_MAP_API_BASE_URL: ${PINVI_KOR_TRAVEL_MAP_API_BASE_URL:-http://host.docker.internal:12701}
      PINVI_KOR_TRAVEL_MAP_SERVICE_TOKEN: ${PINVI_KOR_TRAVEL_MAP_SERVICE_TOKEN:-}
      PINVI_KOR_TRAVEL_MAP_PUBLIC_API_KEY: ${PINVI_KOR_TRAVEL_MAP_PUBLIC_API_KEY:-}
      # canonical kor-travel-map ops는 API container에서 host service로만 호출한다.
      # read/cancel token은 같은 header를 쓰지만 capability별로 서로 다른 값을 전달한다.
      PINVI_KOR_TRAVEL_MAP_ADMIN_BASE_URL: ${PINVI_KOR_TRAVEL_MAP_ADMIN_BASE_URL:-http://host.docker.internal:12701}
      # generic Feature 요청 큐 writer. ordinary service/admin/public credential과 공유하지 않는다.
      KOR_TRAVEL_MAP_FEATURE_REQUEST_TOKEN: ${KOR_TRAVEL_MAP_FEATURE_REQUEST_TOKEN:-}
      PINVI_KOR_TRAVEL_MAP_OPS_READ_TOKEN: ${PINVI_KOR_TRAVEL_MAP_OPS_READ_TOKEN:-}
      PINVI_KOR_TRAVEL_MAP_OPS_CANCEL_TOKEN: ${PINVI_KOR_TRAVEL_MAP_OPS_CANCEL_TOKEN:-}
      # cache target HTTP worker는 non-production 격리 stack에서 compatible pair pin이 모두 있을
      # 때만 명시적으로 켠다. production enable은 final C7 root boundary 전까지 앱이 거부한다.
      PINVI_KOR_TRAVEL_MAP_CACHE_TARGET_SYNC_ENABLED: ${PINVI_KOR_TRAVEL_MAP_CACHE_TARGET_SYNC_ENABLED:-false}
      PINVI_KOR_TRAVEL_MAP_CACHE_TARGET_COMMAND_TOKEN: ${PINVI_KOR_TRAVEL_MAP_CACHE_TARGET_COMMAND_TOKEN:-}
      PINVI_KOR_TRAVEL_MAP_CACHE_TARGET_CONSUMER_TOKEN: ${PINVI_KOR_TRAVEL_MAP_CACHE_TARGET_CONSUMER_TOKEN:-}
      PINVI_KOR_TRAVEL_MAP_CACHE_TARGET_CONSUMER_ID: ${PINVI_KOR_TRAVEL_MAP_CACHE_TARGET_CONSUMER_ID:-pinvi-cache-target-consumer}
      PINVI_KOR_TRAVEL_MAP_CACHE_TARGET_EXPECTED_OPENAPI_SHA256: ${PINVI_KOR_TRAVEL_MAP_CACHE_TARGET_EXPECTED_OPENAPI_SHA256:-}
      PINVI_KOR_TRAVEL_MAP_CACHE_TARGET_EXPECTED_SOURCE_REVISION: ${PINVI_KOR_TRAVEL_MAP_CACHE_TARGET_EXPECTED_SOURCE_REVISION:-}
      PINVI_KOR_TRAVEL_MAP_CACHE_TARGET_EXPECTED_CONTRACT_GENERATION: ${PINVI_KOR_TRAVEL_MAP_CACHE_TARGET_EXPECTED_CONTRACT_GENERATION:-}
      # M05 paired consumer의 read/ACK token은 API worker에만 전달한다. flag=false가 기본이며,
      # Map subscription activation 및 isolated live proof 전에는 startup이 enable을 거부한다.
      PINVI_KOR_TRAVEL_MAP_FEATURE_REFERENCE_RECONCILIATION_ENABLED: ${PINVI_KOR_TRAVEL_MAP_FEATURE_REFERENCE_RECONCILIATION_ENABLED:-false}
      PINVI_KOR_TRAVEL_MAP_FEATURE_REFERENCE_RECONCILIATION_READ_TOKEN: ${PINVI_KOR_TRAVEL_MAP_FEATURE_REFERENCE_RECONCILIATION_READ_TOKEN:-}
      PINVI_KOR_TRAVEL_MAP_FEATURE_REFERENCE_RECONCILIATION_ACK_TOKEN: ${PINVI_KOR_TRAVEL_MAP_FEATURE_REFERENCE_RECONCILIATION_ACK_TOKEN:-}
      PINVI_KOR_TRAVEL_MAP_FEATURE_REFERENCE_RECONCILIATION_POLL_SECONDS: ${PINVI_KOR_TRAVEL_MAP_FEATURE_REFERENCE_RECONCILIATION_POLL_SECONDS:-1}
      PINVI_KOR_TRAVEL_MAP_FEATURE_REFERENCE_RECONCILIATION_BLOCKED_RECHECK_SECONDS: ${PINVI_KOR_TRAVEL_MAP_FEATURE_REFERENCE_RECONCILIATION_BLOCKED_RECHECK_SECONDS:-30}
      PINVI_KOR_TRAVEL_MAP_FEATURE_REFERENCE_RECONCILIATION_EXPECTED_OPENAPI_SHA256: ${PINVI_KOR_TRAVEL_MAP_FEATURE_REFERENCE_RECONCILIATION_EXPECTED_OPENAPI_SHA256:-}
      PINVI_KOR_TRAVEL_MAP_FEATURE_REFERENCE_RECONCILIATION_EXPECTED_SOURCE_REVISION: ${PINVI_KOR_TRAVEL_MAP_FEATURE_REFERENCE_RECONCILIATION_EXPECTED_SOURCE_REVISION:-}
      PINVI_KOR_TRAVEL_MAP_FEATURE_REFERENCE_RECONCILIATION_ACTIVATION_RECEIPT: ${PINVI_KOR_TRAVEL_MAP_FEATURE_REFERENCE_RECONCILIATION_ACTIVATION_RECEIPT:-}
      PINVI_KOR_TRAVEL_MAP_FEATURE_REFERENCE_RECONCILIATION_ACTIVATION_RECEIPT_PATH: ${PINVI_KOR_TRAVEL_MAP_FEATURE_REFERENCE_RECONCILIATION_ACTIVATION_RECEIPT_PATH:-}
      PINVI_KOR_TRAVEL_MAP_FEATURE_REFERENCE_RECONCILIATION_ACTIVATION_RECEIPT_PUBLIC_KEY: ${PINVI_KOR_TRAVEL_MAP_FEATURE_REFERENCE_RECONCILIATION_ACTIVATION_RECEIPT_PUBLIC_KEY:-}
      PINVI_M05_RUNTIME_ATTESTATION_PATH: ${PINVI_M05_RUNTIME_ATTESTATION_PATH:-/run/pinvi/m05/runtime-attestation.json}
      PINVI_M05_RUNTIME_LEASE_DIRECTORY: ${PINVI_M05_RUNTIME_LEASE_DIRECTORY:-/run/pinvi/m05/lease}
      PINVI_M05_RUNTIME_LEASE_MAX_LIFETIME_SECONDS: ${PINVI_M05_RUNTIME_LEASE_MAX_LIFETIME_SECONDS:-120}
      PINVI_M05_ACTIVATION_LEDGER_PATH: ${PINVI_M05_ACTIVATION_LEDGER_PATH:-}
      PINVI_M05_ACTIVATION_HIGH_WATERMARK_PATH: ${PINVI_M05_ACTIVATION_HIGH_WATERMARK_PATH:-}
      PINVI_M05_ACTIVATION_DURABLE_FLOOR_PATH: ${PINVI_M05_ACTIVATION_DURABLE_FLOOR_PATH:-}
      PINVI_M05_ACTIVATION_DURABLE_HISTORY_PATH: ${PINVI_M05_ACTIVATION_DURABLE_HISTORY_PATH:-}
      PINVI_M05_ACTIVATION_DURABLE_ANCHOR_PATH: ${PINVI_M05_ACTIVATION_DURABLE_ANCHOR_PATH:-}
      PINVI_M05_ACTIVATION_PR_URL: ${PINVI_M05_ACTIVATION_PR_URL:-https://github.com/digitie/pinvi/pull/466}
      PINVI_M05_ACTIVATION_MIN_GENERATION: ${PINVI_M05_ACTIVATION_MIN_GENERATION:-1}
      # immutable deploy wrapper가 label/image ID 대조 뒤에만 세 digest를 주입한다.
      # production activation receipt는 API/Web/Dagster exact image pair를 모두 결박한다.
      PINVI_API_IMAGE_DIGEST: ${PINVI_API_IMAGE_DIGEST:-}
      PINVI_WEB_IMAGE_DIGEST: ${PINVI_WEB_IMAGE_DIGEST:-}
      PINVI_DAGSTER_IMAGE_DIGEST: ${PINVI_DAGSTER_IMAGE_DIGEST:-}
      PINVI_KOR_TRAVEL_MAP_CURATION_SNAPSHOT_TOKEN: ${PINVI_KOR_TRAVEL_MAP_CURATION_SNAPSHOT_TOKEN:-}
      # T-VN-40C sealed legacy plan backfill은 snapshot과 다른 maintenance mapping scope를
      # 필요로 한다. 원문은 API runtime에만 전달하며 web/dagster에는 전달하지 않는다.
      PINVI_KOR_TRAVEL_MAP_CURATION_CUTOVER_MAPPING_TOKEN: ${PINVI_KOR_TRAVEL_MAP_CURATION_CUTOVER_MAPPING_TOKEN:-}
      # restore/recovery token은 이 ordinary API container에 전달하지 않는다.
      # ADR-035: Trip WebSocket broker는 process-local in-memory다. Redis/LISTEN fan-out 전까지
      # API worker는 1로 고정한다. 값을 올리면 HTTP mutation broadcast가 다른 worker의 WebSocket에
      # 전달되지 않는다.
      PINVI_API_WORKERS: ${PINVI_API_WORKERS:-1}
      PINVI_VWORLD_API_KEY: ${PINVI_VWORLD_API_KEY:-}
    # ordinary API는 raw dump·restore key·Docker socket을 받지 않는다. root producer의
    # metadata-only catalog와 M05 trust/lease document만 read-only로 노출한다.
    volumes:
      - type: bind
        source: ${PINVI_BACKUP_CATALOG_HOST_DIR:-/tmp/pinvi-backup-catalog}
        target: /var/lib/pinvi/backup-catalog
        read_only: true
      - type: bind
        source: ${PINVI_M05_ACTIVATION_LEDGER_HOST_PATH:-/tmp/pinvi-m05-activation-ledger.jsonl}
        target: ${PINVI_M05_ACTIVATION_LEDGER_PATH:-/run/pinvi/m05/activation-ledger.jsonl}
        read_only: true
      - type: bind
        source: ${PINVI_M05_ACTIVATION_HIGH_WATERMARK_HOST_PATH:-/tmp/pinvi-m05-activation-high-watermark.json}
        target: ${PINVI_M05_ACTIVATION_HIGH_WATERMARK_PATH:-/run/pinvi/m05/activation-high-watermark.json}
        read_only: true
      - type: bind
        source: ${PINVI_M05_ACTIVATION_DURABLE_FLOOR_HOST_PATH:-/tmp/pinvi-m05-activation-durable-floor.json}
        target: ${PINVI_M05_ACTIVATION_DURABLE_FLOOR_PATH:-/run/pinvi/m05/activation-durable-floor.json}
        read_only: true
      - type: bind
        source: ${PINVI_M05_ACTIVATION_DURABLE_HISTORY_HOST_PATH:-/tmp/pinvi-m05-activation-durable-history.jsonl}
        target: ${PINVI_M05_ACTIVATION_DURABLE_HISTORY_PATH:-/run/pinvi/m05/activation-durable-history.jsonl}
        read_only: true
      - type: bind
        source: ${PINVI_M05_ACTIVATION_DURABLE_ANCHOR_HOST_PATH:-/tmp/pinvi-m05-activation-durable-anchor.jsonl}
        target: ${PINVI_M05_ACTIVATION_DURABLE_ANCHOR_PATH:-/run/pinvi/m05/activation-durable-anchor.jsonl}
        read_only: true
      - type: bind
        source: ${PINVI_KOR_TRAVEL_MAP_FEATURE_REFERENCE_RECONCILIATION_ACTIVATION_RECEIPT_HOST_PATH:-/tmp/pinvi-m05-activation-receipt.json}
        target: ${PINVI_KOR_TRAVEL_MAP_FEATURE_REFERENCE_RECONCILIATION_ACTIVATION_RECEIPT_PATH:-/run/pinvi/m05/activation-receipt.json}
        read_only: true
      - type: bind
        source: ${PINVI_M05_RUNTIME_ATTESTATION_HOST_PATH:-/tmp/pinvi-m05-runtime-attestation.json}
        target: ${PINVI_M05_RUNTIME_ATTESTATION_PATH:-/run/pinvi/m05/runtime-attestation.json}
        read_only: true
      # directory mount여야 root watcher의 atomic current.json rename을 다음 verify에서 본다.
      - type: bind
        source: ${PINVI_M05_RUNTIME_LEASE_HOST_DIR:-/tmp/pinvi-m05-runtime-lease}
        target: ${PINVI_M05_RUNTIME_LEASE_DIRECTORY:-/run/pinvi/m05/lease}
        read_only: true
    ports:
      - "127.0.0.1:${PINVI_API_PORT:-12801}:8000"

  # root-only maintenance snapshot producer. app-api에는 이 bind의 write mount나
  # producer credential을 주지 않는다. `docker compose --profile maintenance run --rm app-backup`만 허용한다.
  app-backup:
    image: ${PINVI_API_IMAGE:-pinvi-api:local}
    profiles: ["maintenance"]
    restart: "no"
    user: "0:0"
    depends_on:
      app-postgres:
        condition: service_healthy
      app-db-runtime-role:
        condition: service_completed_successfully
    environment:
      PINVI_ENVIRONMENT: ${PINVI_ENVIRONMENT:-smoke}
      PINVI_BACKUP_DIR: /var/lib/pinvi/restore-trust
      PINVI_BACKUP_CATALOG_PATH: /var/lib/pinvi/backup-catalog/current.json
      PINVI_BACKUP_TRUSTED: "1"
      PINVI_BACKUP_DATABASE_URL: ${PINVI_DATABASE_URL:-postgresql+asyncpg://pinvi_app:pinvi_app_smoke@app-postgres:5432/pinvi}
      PINVI_BACKUP_SCHEMA: ${PINVI_BACKUP_SCHEMA:-app}
      PINVI_BACKUP_MIN_FREE_BYTES: ${PINVI_BACKUP_MIN_FREE_BYTES:-1073741824}
      PINVI_BACKUP_DOCKER_FALLBACK: "0"
    volumes:
      - type: bind
        source: ${PINVI_RESTORE_TRUSTED_BACKUP_HOST_DIR:-/tmp/pinvi-restore-trust}
        target: /var/lib/pinvi/restore-trust
      - type: bind
        source: ${PINVI_BACKUP_CATALOG_HOST_DIR:-/tmp/pinvi-backup-catalog}
        target: /var/lib/pinvi/backup-catalog
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export PINVI_BACKUP_PG_DUMP_BIN="$$(command -v pg_dump)"
        export PINVI_BACKUP_PG_RESTORE_BIN="$$(command -v pg_restore)"
        export PINVI_BACKUP_PSQL_BIN="$$(command -v psql)"
        export PINVI_BACKUP_PG_DUMP_SHA256="$$(sha256sum "$${PINVI_BACKUP_PG_DUMP_BIN}" | awk 'NR == 1 { print $$1}')"
        export PINVI_BACKUP_PG_RESTORE_SHA256="$$(sha256sum "$${PINVI_BACKUP_PG_RESTORE_BIN}" | awk 'NR == 1 { print $$1}')"
        export PINVI_BACKUP_PSQL_SHA256="$$(sha256sum "$${PINVI_BACKUP_PSQL_BIN}" | awk 'NR == 1 { print $$1}')"
        # app-postgres hostname은 root producer에서 한 번만 해석해 hostaddr로
        # 결박한다. preconfigured hostaddr/endpoint override는 dump 전에 거부한다.
        exec python /app/scripts/trusted-backup-entrypoint.py

  # Explicit one-shot only: app-api is never allowed to receive the migrator URL.
  # `scripts/docker-app.sh migrate` mounts the bootstrap credential and invokes it here.
  app-migrator:
    image: ${PINVI_API_IMAGE:-pinvi-api:local}
    depends_on:
      app-postgres:
        condition: service_healthy
      app-db-runtime-role:
        condition: service_completed_successfully
    environment:
      # This command only owns schema migration/admin bootstrap. It never serves traffic.
      # The non-inheriting login defaults to app schema owner, then 0101 switches its
      # M05 receipt DDL to PINVI_MIGRATION_OWNER and restores the app owner for versioning.
      PINVI_ENVIRONMENT: ${PINVI_ENVIRONMENT:-smoke}
      PINVI_DATABASE_URL: postgresql+asyncpg://${PINVI_MIGRATOR_DB_USER:-pinvi_migrator}:${PINVI_MIGRATOR_DB_PASSWORD:-pinvi_app_smoke}@app-postgres:5432/pinvi
      # 0101 grants the fresh app runtime role only after the M05 DDL and owner fence.
      PINVI_APP_DB_USER: ${PINVI_APP_DB_USER:-pinvi_app}
      PINVI_MIGRATION_OWNER: ${PINVI_MIGRATION_OWNER:-pinvi_migration_owner}
      PINVI_MIGRATOR_DB_USER: ${PINVI_MIGRATOR_DB_USER:-pinvi_migrator}
      PINVI_M05_LEGACY_REBASELINE: "0"

  # 0061→0100→0101은 이 별도 profile에서만 root/session owner로 수행한다.
  # ordinary app-migrator와 app-api에는 root URL을 전달하지 않는다.
  app-legacy-rebaseline-migrator:
    profiles: [legacy-rebaseline]
    image: ${PINVI_API_IMAGE:-pinvi-api:local}
    user: "0:0"
    depends_on:
      app-postgres:
        condition: service_healthy
    environment:
      PINVI_ENVIRONMENT: ${PINVI_ENVIRONMENT:-smoke}
      # wrapper가 legacy를 명시하지 않은 상태에서 직접 실행하면 인증 실패로 닫힌다.
      PINVI_DATABASE_URL: ${PINVI_LEGACY_REBASELINE_DATABASE_URL:-postgresql+asyncpg://invalid:invalid@app-postgres:5432/pinvi}
      PINVI_APP_DB_USER: ${PINVI_APP_DB_USER:-pinvi_app}
      PINVI_APP_SCHEMA_OWNER: ${PINVI_APP_SCHEMA_OWNER:-pinvi_app_owner}
      PINVI_MIGRATION_OWNER: ${PINVI_MIGRATION_OWNER:-pinvi_migration_owner}
      PINVI_MIGRATOR_DB_USER: ${PINVI_MIGRATOR_DB_USER:-pinvi_migrator}
      PINVI_M05_LEGACY_REBASELINE: "1"
      PINVI_M05_LEGACY_REBASELINE_TARGET_PROFILE: ${PINVI_M05_LEGACY_REBASELINE_TARGET_PROFILE:-n150-production}
      PINVI_M05_LEGACY_REBASELINE_RECEIPT_PATH: /run/pinvi/m05/legacy-rebaseline-receipt.json

  app-web:
    build:
      # immutable deploy wrapper는 API와 Web/Dagster 모두 같은 exact archive에서 빌드한다.
      context: ${PINVI_APP_BUILD_CONTEXT:-..}
      dockerfile: apps/web/Dockerfile
      args:
        PINVI_SOURCE_REVISION: ${PINVI_SOURCE_REVISION:-development}
        PINVI_BUILD_ENVIRONMENT: ${PINVI_ENVIRONMENT:-smoke}
        # 운영은 infra/.env.prod 의 NEXT_PUBLIC_* 값(빌드타임 embed)로 override.
        NEXT_PUBLIC_PINVI_API_URL: ${NEXT_PUBLIC_PINVI_API_URL:-http://127.0.0.1:${PINVI_API_PORT:-12801}}
        NEXT_PUBLIC_GRAFANA_URL: ${NEXT_PUBLIC_GRAFANA_URL:-http://127.0.0.1:${PINVI_GRAFANA_PORT:-12205}}
        NEXT_PUBLIC_GRAFANA_DASHBOARD_PATH: "${NEXT_PUBLIC_GRAFANA_DASHBOARD_PATH:-/d/pinvi/overview?orgId=1&kiosk=tv}"
        NEXT_PUBLIC_PINVI_RESTORE_HOTSWAP_UI_ENABLED: ${NEXT_PUBLIC_PINVI_RESTORE_HOTSWAP_UI_ENABLED:-0}
        NEXT_PUBLIC_VWORLD_API_KEY: ${NEXT_PUBLIC_VWORLD_API_KEY:-}
    image: ${PINVI_WEB_IMAGE:-pinvi-web:local}
    environment:
      PINVI_ENVIRONMENT: ${PINVI_ENVIRONMENT:-smoke}
      PINVI_GRAFANA_HEALTH_URL: ${PINVI_GRAFANA_HEALTH_URL:-http://grafana:3000}
      NEXT_PUBLIC_VWORLD_API_KEY: ${NEXT_PUBLIC_VWORLD_API_KEY:-}
    depends_on:
      - app-api
    ports:
      - "127.0.0.1:${PINVI_WEB_PORT:-12805}:3000"

  # Dagster webserver — 고정 포트 12802(컨테이너/호스트 동일). profile "etl"로만 기동.
  # reverse proxy: pinvi-dagster.<domain> → host :12802.
  app-dagster:
    profiles: ["etl"]
    build:
      context: ${PINVI_APP_BUILD_CONTEXT:-..}
      dockerfile: apps/etl/Dockerfile
      args:
        - PINVI_SOURCE_REVISION
        - PINVI_BUILD_ENVIRONMENT=${PINVI_ENVIRONMENT:-smoke}
    image: ${PINVI_DAGSTER_IMAGE:-pinvi-dagster:local}
    container_name: pinvi-app-dagster
    restart: unless-stopped
    depends_on:
      app-postgres:
        condition: service_healthy
      app-db-runtime-role:
        condition: service_completed_successfully
    environment:
      PINVI_ENVIRONMENT: ${PINVI_ENVIRONMENT:-smoke}
      PINVI_DATABASE_URL: ${PINVI_DATABASE_URL:-postgresql+asyncpg://pinvi_app:pinvi_app_smoke@app-postgres:5432/pinvi}
      PINVI_RUSTFS_ENDPOINT_URL: http://app-rustfs:9000
      PINVI_RUSTFS_BUCKET: pinvi-media
      PINVI_RUSTFS_ACCESS_KEY_ID: ${PINVI_RUSTFS_ACCESS_KEY_ID:-rustfsadmin}
      PINVI_RUSTFS_SECRET_ACCESS_KEY: ${PINVI_RUSTFS_SECRET_ACCESS_KEY:-rustfsadmin}
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
      DAGSTER_HOME: /opt/pinvi/.dagster
    ports:
      - "${PINVI_DAGSTER_DEV_PORT:-12802}:12802"
    volumes:
      - app-dagster:/opt/pinvi/.dagster

  cadvisor:
    profiles: ["observability"]
    image: ${PINVI_CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.52.1}
    container_name: pinvi-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    ports:
      - "${PINVI_CADVISOR_PORT:-12301}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  blackbox:
    profiles: ["observability"]
    image: ${PINVI_BLACKBOX_IMAGE:-prom/blackbox-exporter:v0.25.0}
    container_name: pinvi-app-blackbox
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

  prometheus:
    profiles: ["observability"]
    image: ${PINVI_PROMETHEUS_IMAGE:-prom/prometheus:v2.53.1}
    container_name: pinvi-prometheus
    restart: unless-stopped
    user: "${PINVI_PROMETHEUS_RUN_AS_USER:-0}"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    ports:
      - "${PINVI_PROMETHEUS_PORT:-12401}:9090"
    volumes:
      - ./prometheus/prometheus.app.yml:/etc/prometheus/prometheus.yml:ro
      - app-prometheus:/prometheus
    depends_on:
      app-api:
        condition: service_started
      cadvisor:
        condition: service_started
      blackbox:
        condition: service_started

  grafana:
    profiles: ["observability"]
    image: ${PINVI_GRAFANA_IMAGE:-grafana/grafana:11.1.4}
    container_name: pinvi-grafana
    restart: unless-stopped
    user: "${PINVI_GRAFANA_RUN_AS_USER:-0}"
    environment:
      GF_SECURITY_ADMIN_USER: ${PINVI_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${PINVI_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: ${NEXT_PUBLIC_GRAFANA_URL:-http://127.0.0.1:${PINVI_GRAFANA_PORT:-12205}}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${PINVI_GRAFANA_PORT:-12205}:3000"
    volumes:
      - app-grafana:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

volumes:
  app-postgres:
  app-prometheus:
  app-grafana:
  app-dagster:
