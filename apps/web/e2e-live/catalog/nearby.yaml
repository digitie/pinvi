# NEAR — nearby / transport information around trip places and on the explore map.
# PinVi main b1cef056 (PR #619, 2026-11-03). 41 cases: 35 scripted, 2 manual, 4 blocked.
# Prod facts assumed: PINVI_KOR_TRAVEL_MAP_TRANSPORT_ENABLED=true, all four layers available
# (handoff 2026-10-26: fuel/rest/incident/airport). Explore map default = 서울시청, zoom 12.

- id: NEAR-001
  title: 탐색 지도 교통 정보 패널 — 4개 칩(주유소·휴게소·교통 돌발·공항) 순서·초기 꺼짐·요청 없음
  priority: P1
  tags: [desktop, mobile, nearby]
  preconditions:
    - account: test@test.com (user)
    - env: prod /transport/status enabled=true
  data_sources: [transport:status]
  steps:
    - 로그인 → '지도' → /map
    - /transport/status 응답 대기, 패널 '교통 정보' 표시 확인
  expected:
    - role=group '교통 정보 레이어' 안 버튼 텍스트가 정확히 [주유소, 휴게소, 교통 돌발, 공항] 순
    - 모든 칩 aria-pressed=false, 레이어 상태 줄·마커 legend 없음
    - 칩을 켜기 전 markers-in-bounds 요청 0건
  cleanup: []
  automation: scripted
  spec: specs/nearby/explore-panel.live.spec.ts#NEAR-001

