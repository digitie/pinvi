name: mobile

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'apps/web/vendor/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/mobile.yml'
      - 'scripts/check-mobile-styling.mjs'
      - 'scripts/mobile-web-smoke.mjs'
      - 'scripts/serve-mobile-export.py'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'apps/web/vendor/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/mobile.yml'
      - 'scripts/check-mobile-styling.mjs'
      - 'scripts/mobile-web-smoke.mjs'
      - 'scripts/serve-mobile-export.py'

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-typecheck:
    name: mobile-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      # T-358 — npm 10.9.7은 lockfile 없는 설치에서 arborist 버그(`edgesOut`)로 죽는다.
      # `npx --yes npm@12.0.1 ci`만 쓰는 job도 로컬(npm 12)과 해석이 갈리지 않도록 같은 버전으로 맞춘다.
      - name: Pin npm 12.0.1
        run: npm install -g npm@12.0.1

      - name: Install dependencies
        run: npx --yes npm@12.0.1 ci --no-audit --no-fund --engine-strict

      - name: Check mobile common dependencies
        run: npm --workspace @pinvi/mobile run check:dependencies

      - name: Check mobile styling contract
        run: npm --workspace @pinvi/mobile run check:styling

      - name: React Doctor (@pinvi/mobile)
        run: npm --workspace @pinvi/mobile run doctor

      - name: Typecheck (@pinvi/mobile)
        run: npm --workspace @pinvi/mobile run typecheck

  mobile-export:
    name: mobile-export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Pin npm 12.0.1
        run: npm install -g npm@12.0.1
      - name: Install dependencies
        run: npx --yes npm@12.0.1 ci --no-audit --no-fund --engine-strict
      - name: Export Expo Web
        run: npm --workspace @pinvi/mobile run export:web
      - name: Export Android bundle
        run: npm --workspace @pinvi/mobile run export:android
      - name: Export iOS bundle
        run: npm --workspace @pinvi/mobile run export:ios
      - name: Install Chromium for Expo Web smoke
        run: npx playwright install --with-deps chromium
      - name: Smoke exported mobile login and fonts
        env:
          PINVI_MOBILE_SMOKE_OUTPUT: ${{ runner.temp }}/pinvi-mobile-smoke
        run: |
          python3 scripts/serve-mobile-export.py --directory apps/mobile/dist/web &
          mobile_export_pid=$!
          trap 'kill "$mobile_export_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:12805/login/ > /dev/null; then break; fi
            sleep 1
          done
          npm --workspace @pinvi/mobile run test:e2e:web

  # Linux native와 같은 tarball의 macOS 자동 WASM 경로를 실제 Expo export로 검증한다.
  mobile-wasm-macos:
    name: mobile-wasm-macos
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Pin npm 12.0.1
        run: npm install -g npm@12.0.1
      - name: Install dependencies
        run: npx --yes npm@12.0.1 ci --no-audit --no-fund --engine-strict
      - name: Check mobile styling contract
        run: npm --workspace @pinvi/mobile run check:styling
      - name: Export iOS using bundled patched WASM
        run: npm --workspace @pinvi/mobile run export:ios

  # ESLint10 호환 typescript-eslint/react-hooks 구성. Aggregate gate의 필수 check.
  # `expo lint` 대신 eslint 바이너리를 직접 호출한다(설정 부재 시 expo CLI가 CI에서 자동 설치·
  # 파일 생성하는 mutating fallback 방지). warning도 실패(--max-warnings 0).
  mobile-lint:
    name: mobile-lint
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      # T-358 — npm 10.9.7은 lockfile 없는 설치에서 arborist 버그(`edgesOut`)로 죽는다.
      # `npx --yes npm@12.0.1 ci`만 쓰는 job도 로컬(npm 12)과 해석이 갈리지 않도록 같은 버전으로 맞춘다.
      - name: Pin npm 12.0.1
        run: npm install -g npm@12.0.1

      - name: Install dependencies
        run: npx --yes npm@12.0.1 ci --no-audit --no-fund --engine-strict

      - name: Lint (@pinvi/mobile)
        run: npm --workspace @pinvi/mobile run lint

  # SDK patch 정합성을 실제20/20으로 확인했다. 권장 버전 drift는 필수 실패로 잡는다.
  # 네트워크 장애도 원문으로 구분하며 검사 우회·exclude 추가로 숨기지 않는다.
  mobile-doctor:
    name: mobile-doctor
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      # T-358 — npm 10.9.7은 lockfile 없는 설치에서 arborist 버그(`edgesOut`)로 죽는다.
      # `npx --yes npm@12.0.1 ci`만 쓰는 job도 로컬(npm 12)과 해석이 갈리지 않도록 같은 버전으로 맞춘다.
      - name: Pin npm 12.0.1
        run: npm install -g npm@12.0.1

      - name: Install dependencies
        run: npx --yes npm@12.0.1 ci --no-audit --no-fund --engine-strict

      - name: expo-doctor (@pinvi/mobile)
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: '1'
          CI: '1'
        run: npx --yes expo-doctor@1.20.2 "$PWD"
