name: Aggregate CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: aggregate-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  aggregate:
    name: Aggregate CI gate
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # T-348: 이 게이트는 required check가 끝나길 기다리기만 하므로, 아래 script의 내부
    # deadline(폴링 루프 자체가 포기하는 시점)과 이 job-level timeout-minutes(GitHub
    # Actions가 러너를 강제 종료하는 시점) 둘 다 대상 job들 중 가장 긴 것(현재 api.yml의
    # lint-typecheck-test, 35분)보다 길어야 한다 — 둘 중 하나만 올리면 다른 쪽에서 여전히
    # "job은 성공했는데 게이트만 포기"가 재현된다(PR #476, #480에서 실제 재현: 당시 job
    # timeout 12분이 아니라 아래 deadline 10분에서 먼저 끊겼다). deadline을 40분으로, 이
    # job-level timeout은 그 위에 5분 여유를 더해 45분으로 잡는다.
    timeout-minutes: 45

    steps:
      - name: Wait for required path checks
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const changed = files.flatMap((file) =>
              [file.filename, file.previous_filename].filter(Boolean),
            );
            const hasAny = (predicates) => changed.some((path) => predicates.some((predicate) => predicate(path)));
            const startsWith = (prefix) => (path) => path.startsWith(prefix);
            const equals = (target) => (path) => path === target;

            const requiredChecks = [];
            if (hasAny([
              startsWith("apps/api/"),
              startsWith("contracts/"),
              equals("scripts/api-image-provenance.sh"),
              equals("scripts/deploy-node.sh"),
              equals("scripts/docker-app.sh"),
              equals("scripts/migrator-lifecycle-lock.sh"),
              equals("scripts/backup-db.sh"),
              startsWith("scripts/m05_"),
              equals("scripts/trusted-hotswap-entrypoint.py"),
              equals("scripts/trusted-hotswap-root.sh"),
              equals("scripts/n150-playwright-runner.sh"),
              equals("scripts/verify-v100-live-gate.sh"),
              equals("scripts/restore-db.sh"),
              equals("scripts/restore-hotswap.sh"),
              equals("scripts/restore-staging-drill.sh"),
              equals("infra/docker-compose.app.yml"),
              equals("infra/postgres/bootstrap-pinvi-runtime-role.sh"),
              equals("infra/.env.prod.example"),
              equals(".env.example"),
              equals(".github/workflows/api.yml"),
              equals(".github/workflows/aggregate-ci.yml"),
              equals("pyproject.toml"),
            ])) {
              requiredChecks.push("lint-typecheck-test");
              requiredChecks.push("docker-provenance-image");
              // kor-travel-map 계약 스냅샷의 핀↔vendored 정합 게이트.
              // `Aggregate CI gate`가 유일한 required check이므로 여기에 넣지 않으면
              // job이 red여도 머지가 막히지 않는다(= 과거 항상-skip 테스트와 같은 강도).
              requiredChecks.push("contract-pin-consistency");
              // T-351: api.yml의 `integration-test` matrix(`group: [1, 2, 3, 4]`)가 만드는
              // 4개 check 이름이다 — GitHub Actions matrix job의 check 이름은
              // "<job id> (<matrix 값>)" 형식이라 여기 문자열 그대로 정확히 맞아야 한다.
              // api.yml의 group 개수를 바꾸면 이 배열도 같이 바꿔야 한다 — 안 바꾸면 늘어난/
              // 줄어든 shard를 게이트가 기다리지 않아 위 contract-pin-consistency와 같은
              // 항상-skip 맹점이 재발한다.
              requiredChecks.push("integration-test (1)");
              requiredChecks.push("integration-test (2)");
              requiredChecks.push("integration-test (3)");
              requiredChecks.push("integration-test (4)");
            }
            if (hasAny([
              startsWith("apps/web/"),
              startsWith("packages/"),
              equals("scripts/m05_activation_attestation.py"),
              equals("scripts/n150-playwright-runner.sh"),
              equals("scripts/verify-v100-live-gate.sh"),
              equals("infra/docker-compose.app.yml"),
              equals("infra/.env.prod.example"),
              equals(".env.example"),
              equals("package.json"),
              equals("package-lock.json"),
              equals("tsconfig.base.json"),
              equals(".github/workflows/web.yml"),
              equals(".github/workflows/aggregate-ci.yml"),
            ])) {
              requiredChecks.push("lint-typecheck-build");
              // `lint-typecheck-build`는 전체 체크아웃 트리를 검증하고 이미지는
              // 다른 트리를 만든다. 이걸 기다리지 않으면 이미지가 서지 않는 main이
              // merge되고, 그 사실이 1~2시간짜리 pinned rebuild에서야 드러난다.
              requiredChecks.push("docker-image");
              // Web Playwright는 lint/build와 별개 job이다. Aggregate gate가 유일한
              // required check이므로 여기서 기다리지 않으면 E2E 실패가 merge를 막지 못한다(T-323).
              requiredChecks.push("e2e");
            }
            if (hasAny([
              startsWith("apps/mobile/"),
              startsWith("packages/"),
              equals("package.json"),
              equals("package-lock.json"),
              equals("tsconfig.base.json"),
              equals(".github/workflows/mobile.yml"),
            ])) {
              requiredChecks.push("mobile-typecheck");
              requiredChecks.push("mobile-lint");
            }
            if (hasAny([
              startsWith("apps/etl/"),
              equals(".github/workflows/etl.yml"),
            ])) {
              requiredChecks.push("sanity");
            }

            core.info(`Changed files: ${changed.join(", ") || "(none)"}`);
            core.info(`Required path checks: ${requiredChecks.join(", ") || "(none)"}`);
            if (requiredChecks.length === 0) {
              core.info("No path-filtered CI checks are required for this PR.");
              return;
            }

            const deadline = Date.now() + 40 * 60 * 1000;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            while (true) {
              const runs = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref: headSha,
                per_page: 100,
              });
              const byName = new Map();
              for (const run of runs) {
                if (run.head_sha !== headSha || run.app?.slug !== "github-actions") {
                  continue;
                }
                const previous = byName.get(run.name);
                if (!previous || run.id > previous.id) {
                  byName.set(run.name, run);
                }
              }
              const pending = [];

              for (const name of requiredChecks) {
                const run = byName.get(name);
                if (!run) {
                  pending.push(`${name}: missing`);
                  continue;
                }
                if (run.status !== "completed") {
                  pending.push(`${name}: ${run.status}`);
                  continue;
                }
                if (run.conclusion !== "success") {
                  core.setFailed(`${name} concluded with ${run.conclusion}`);
                  return;
                }
              }

              if (pending.length === 0) {
                core.info("All required path-filtered checks passed.");
                return;
              }
              if (Date.now() > deadline) {
                core.setFailed(`Timed out waiting for checks: ${pending.join(", ")}`);
                return;
              }

              core.info(`Waiting for checks: ${pending.join(", ")}`);
              await sleep(20 * 1000);
            }
