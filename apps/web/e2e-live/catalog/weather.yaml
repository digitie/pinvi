- id: WX-011
  title: 시드 여행 일출·일몰이 NOAA 계산과 ±5분 (영월·제주·설악산·서울·울릉도)
  priority: P1
  tags: [desktop, weather]
  preconditions:
    - account: test@test.com (user)
    - data: 시드 여행 '[e2e-seed] weather-sun' (제목은 PINVI_E2E_SEED_SUN_TRIP) — 실행 30분 이상 전에 만들어 두고 일자마다 좌표 있는 장소 1개(1일차 영월 고씨굴, 2일차 제주 성산일출봉, 3일차 설악산, 4일차 서울역, 5일차 울릉도). 삭제 금지.
  data_sources: [map:attraction, map:park, map:hiking-trail, map:transit, kasi]
  steps:
    - 여행 목록에서 시드 여행 열기 → GET /trips/{id} 캡처
    - 일자마다 탭 클릭 → trip-day-rise-set '일출 HH:MM' '일몰 HH:MM' 파싱
    - 그 일자 POI 좌표(centroid)로 NOAA 일출/일몰(KST) 계산
  expected:
    - status=success 인 일자 ≥ 1 (아니면 시드가 낡음 → 실패)
    - 각 일자 |UI − NOAA| ≤ 5분 (일출·일몰 각각)
  cleanup:
    - 없음(읽기 전용)
  automation: scripted
  spec: specs/weather/weather-sunrise.live.spec.ts#WX-011
  notes: 기준 좌표는 그 일자 POI centroid(trip_day_rise_set.py resolve_day_reference) — 일자당 1곳이면 그 장소. 시드 없으면 skip(사유 기록).

