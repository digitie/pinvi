# AREA: trip — itinerary lifecycle & styles (PinVi prod, live backends, user account)
# Schema: see ../SPEC.md. All mutating cases create '[e2e]'-prefixed trips and delete them in afterEach.
# Dates are relative to the run date (isoDate(+N)) so bucket logic (예정/지난 여행) stays stable.

# ───────────────────────────── create / shapes / dates ─────────────────────────────
- id: TRIP-001
  title: 당일 여행 생성 — 일자 1개 자동 생성, 일자 추가 불가 안내
  priority: P1
  tags: [desktop, mobile, mutating]
  preconditions:
    - account: test@test.com (user)
  data_sources: []
  steps:
    - 여행 목록 → 새 여행 저장 폼: 제목 '[e2e] 당일 …', 지역 '서울', 시작일=종료일=D+7 → '초안 저장'
    - 목록 카드 '열기/업데이트' → 상세 (모바일: '패널 열기')
  expected:
    - 일자 탭 '1일차'만 존재, 일자 목록에 D+7 날짜('YYYY년 M월 D일')
    - 헤더 '1일 · 0개 장소'(모바일 '1일 · 0곳')
    - 일자 추가 버튼 비활성 + '여행 기간은 최대 1일입니다. 기간을 먼저 늘려주세요.'
  cleanup:
    - afterEach deleteTrip(id)
  automation: scripted
  spec: specs/trip/trip-create.live.spec.ts#TRIP-001

