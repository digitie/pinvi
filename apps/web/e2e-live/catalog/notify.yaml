- id: NTF-013
  title: trip_created 메시지 본문 정확성 — '🧳 새 여행이 만들어졌습니다 — <제목>' / '📅 M월 D일 ~ M월 D일' / '📍 지역', 날짜 없음 '미정 ~ 미정'
  priority: P1
  tags: [telegram, mutating]
  preconditions:
    - env: PINVI_E2E_TELEGRAM_CHAT_ID
    - chat reader: Bot API로는 읽을 수 없음(봇은 다른 봇의 메시지를 getUpdates로 받지 못함) → 전용 테스트 Telegram 사용자 계정의 MTProto 세션(PINVI_E2E_TELEGRAM_READER_SESSION, Telethon/GramJS string session) 또는 소유자 수동 확인 필요
  data_sources: [telegram:sendMessage]
  steps:
    - NTF-012와 동일하게 여행 생성(제목·날짜·지역 알려진 값), 두 번째는 날짜·지역 없이 생성
    - 테스트 chat의 최신 메시지 2건을 읽는다
  expected:
    - "본문 1 == \"🧳 새 여행이 만들어졌습니다 — [e2e] …\\n\\n📅 {M}월 {D}일 ~ {M}월 {D}일\\n📍 부산\" (월·일 0 패딩 없음, apps/api/app/services/telegram_messages.py)"
    - 본문 2 == "🧳 새 여행이 만들어졌습니다 — …\n\n📅 미정 ~ 미정" (📍 줄 없음)
    - 이메일·토큰·stack trace 등 PII/비밀 없음(§1)
  cleanup:
    - "여행 삭제"
    - "sweep"
  automation: blocked
  notes: "소유자가 reader 세션(테스트 전용 사용자)을 제공하면 helpers `readLatestTelegramMessages(chatId, n)` 추가 후 scripted 전환."

