  automation: scripted
  spec: specs/notify/notify-schedule.live.spec.ts#NTF-020
  notes: "#636(PR688). 실제 전송 3건(전체·2일차·1일차 멱등 1회)이 전용 테스트 chat 으로 간다. 수신 본문 대조는 chat reader 가 없어 NTF-013 과 같이 범위 밖. 사용자당 대기 수동 전송 3건 상한(리뷰 보완, 429 TELEGRAM_SEND_BACKLOG)."

