name: 공통 프론트엔드 정책
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  common-policy:
    uses: digitie/kor-travel-common/.github/workflows/frontend-consumer-guard.yml@309b881f8fd6d657b448f43b6fc61939fde742c2
    with:
      common-ref: 309b881f8fd6d657b448f43b6fc61939fde742c2
      frontends: >-
        [{"package":"apps/web/package.json","lock":"package-lock.json","workspace":"apps/web","profile":"web"},{"package":"apps/mobile/package.json","lock":"package-lock.json","workspace":"apps/mobile","profile":"mobile"}]
      toolchain-manifests: '["package.json"]'
      node-dockerfiles: '["apps/web/Dockerfile"]'
