name: web

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/m05_activation_attestation.py'
      - 'scripts/n150-playwright-runner.sh'
      - 'scripts/verify-v100-live-gate.sh'
      - 'infra/docker-compose.app.yml'
      - 'infra/.env.prod.example'
      - '.env.example'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/web.yml'
      - '.github/workflows/aggregate-ci.yml'
      # deps 스테이지가 모든 workspace manifest와 공유 vendor로 설치한다.
      # 모바일 manifest도 감시한다. 공유 vendor는 위 apps/web/**가 포함한다.
      - 'apps/mobile/package.json'
      - '.dockerignore'
      - 'scripts/validate-image-provenance.sh'
      - 'scripts/check_web_image_provenance.py'
      - 'scripts/tests/test_web_image_provenance.py'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/m05_activation_attestation.py'
      - 'scripts/n150-playwright-runner.sh'
      - 'scripts/verify-v100-live-gate.sh'
      - 'infra/docker-compose.app.yml'
      - 'infra/.env.prod.example'
      - '.env.example'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/web.yml'
      - '.github/workflows/aggregate-ci.yml'
      # deps 스테이지가 모든 workspace manifest와 공유 vendor로 설치한다.
      # 모바일 manifest도 감시한다. 공유 vendor는 위 apps/web/**가 포함한다.
      - 'apps/mobile/package.json'
      - '.dockerignore'
      - 'scripts/validate-image-provenance.sh'
      - 'scripts/check_web_image_provenance.py'
      - 'scripts/tests/test_web_image_provenance.py'

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Web 검사는 merge ref가 아니라 exact PR head를 검증한다.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      # T-358 — npm 10.9.7은 lockfile 없는 설치에서 arborist 버그(`edgesOut`)로 죽는다.
      # `npx --yes npm@12.0.1 ci`만 쓰는 job도 로컬(npm 12)과 해석이 갈리지 않도록 같은 버전으로 맞춘다.
      - name: Pin npm 12.0.1
        run: npm install -g npm@12.0.1

      # T-358 — lockfile을 node_modules가 있는 상태에서 재생성하면 npm이 디스크에서
      # 트리를 읽어 `integrity`를 적지 않는다. T-352에서 실제로 보유율이 100% -> 4.8%로
      # 떨어진 채 머지됐고 어떤 게이트도 잡지 못했다. lockfile만 읽으므로 설치 전에 둔다.
      - name: Check lockfile integrity coverage
        run: node scripts/check-lockfile-integrity.mjs

      - name: Install dependencies
        run: npx --yes npm@12.0.1 ci --no-audit --no-fund --engine-strict

      - name: Check common dependencies
        run: npm run check:dependencies --workspace @pinvi/web

      - name: React Doctor (web)
        run: npm run doctor --workspace @pinvi/web

      - name: Lint (workspaces)
        run: npm run lint

      - name: Typecheck (workspaces)
        run: npm run typecheck

      # 루트 test는 `--workspaces --if-present`라 apps/web + packages/{domain,schemas}를 모두 돈다.
      # 이전에는 @pinvi/web만 호출해 packages의 24파일 104테스트가 CI에서 한 번도 실행되지 않았다(T-321).
      - name: Unit tests (workspaces)
        run: npm test

      - name: Build (workspaces)
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:13805
        run: npm run build

  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # `lint-typecheck-build`는 **전체 체크아웃**에서 `npx --yes npm@12.0.1 ci`로 돈다. 이미지 빌드는
    # 그 트리를 쓰지 않는다 — deps 스테이지가 manifest만 복사해 따로 install한다.
    # 그래서 두 트리가 갈라져도 CI는 초록이고, 깨진 main은 1~2시간짜리 pinned
    # rebuild에서야 드러났다(2026-09-02: `Can't resolve 'tailwindcss'`로 회전
    # 사이클 1회 소각). 이미지가 실제로 서는지는 이미지로만 증명된다.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve and verify actual checkout revision
        id: source
        env:
          EXPECTED_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          revision="$(git rev-parse --verify HEAD^{commit})"
          test "$revision" = "$EXPECTED_SOURCE_REVISION"
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      - name: Image provenance negative controls
        run: python3 -m unittest discover -s scripts/tests -p test_web_image_provenance.py -v

      - name: Build the production web image
        env:
          PINVI_CI_SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: >-
          docker build --file apps/web/Dockerfile
          --build-arg PINVI_BUILD_ENVIRONMENT=production
          --build-arg PINVI_SOURCE_REVISION="${PINVI_CI_SOURCE_REVISION}"
          --tag "pinvi-web-ci:${PINVI_CI_SOURCE_REVISION}" .

      - name: Verify built OCI revision and ENV against checkout
        env:
          PINVI_CI_SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          docker image inspect "pinvi-web-ci:${PINVI_CI_SOURCE_REVISION}" > "$RUNNER_TEMP/web-image-inspect.json"
          python3 scripts/check_web_image_provenance.py --expected-revision "$PINVI_CI_SOURCE_REVISION" "$RUNNER_TEMP/web-image-inspect.json"

      - name: Reject a different valid commit label on the built metadata
        env:
          PINVI_CI_SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          image = json.loads((root / "web-image-inspect.json").read_text())
          expected = os.environ["PINVI_CI_SOURCE_REVISION"]
          wrong = "0" * 40 if expected != "0" * 40 else "1" * 40
          image[0]["Config"]["Labels"]["org.opencontainers.image.revision"] = wrong
          (root / "web-image-wrong-label.json").write_text(json.dumps(image))
          PY
          if python3 scripts/check_web_image_provenance.py --expected-revision "$PINVI_CI_SOURCE_REVISION" "$RUNNER_TEMP/web-image-wrong-label.json"; then
            echo "different valid commit label was incorrectly accepted" >&2
            exit 1
          fi

      # `next`는 항상 루트로 hoist되므로 그 해석을 확인하는 것은 아무것도 증명하지
      # 않는다 — 깨진 Dockerfile로도 통과한다(적대 리뷰 MAJOR-4). 빌드 실패 자체가
      # 그 결함의 게이트이고(실측: 수정 전 Dockerfile은 `docker build`에서 죽는다),
      # 빌드가 증명하지 못하는 것은 **이미지가 실제로 서는가**다.
      - name: The built image boots and answers
        env:
          PINVI_CI_SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          docker run -d --name web-ci -p 3000:3000 "pinvi-web-ci:${PINVI_CI_SOURCE_REVISION}"
          for _ in $(seq 1 60); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)"
            # 백엔드 없이 도는 확인이라 2xx를 요구하지 않는다. HTTP 응답이 왔다는
            # 것만으로 `next start`가 살아 있음이 증명된다.
            if [ -n "${code}" ] && [ "${code}" != "000" ]; then
              echo "web responded with HTTP ${code}"
              docker rm -f web-ci >/dev/null
              exit 0
            fi
            sleep 2
          done
          docker logs web-ci
          docker rm -f web-ci >/dev/null
          exit 1

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # T-323: aggregate-ci.yml waits for this exact GitHub Actions check on Web changes.
    steps:
      - uses: actions/checkout@v4
        with:
          # live E2E도 lint/build와 동일한 exact PR head를 사용한다.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      # T-358 — npm 10.9.7은 lockfile 없는 설치에서 arborist 버그(`edgesOut`)로 죽는다.
      # `npx --yes npm@12.0.1 ci`만 쓰는 job도 로컬(npm 12)과 해석이 갈리지 않도록 같은 버전으로 맞춘다.
      - name: Pin npm 12.0.1
        run: npm install -g npm@12.0.1

      - name: Install dependencies
        run: npx --yes npm@12.0.1 ci --no-audit --no-fund --engine-strict

      # 실제 mutation은 N150 격리 stack에서만 허용하지만, 두 pinned suite의 탐색 가능성은 PR CI에서 고정한다.
      - name: Verify M04/M05 live-mutating E2E catalog
        working-directory: apps/web
        run: >-
          npx playwright test -c playwright.live-mutating.config.ts --list
          e2e/admin-feature-request-queue-live-mutating.live.ts
          e2e/admin-feature-reference-reconciliations-live-mutating.live.ts

      - name: Install Playwright chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # 모든 e2e 는 page.route 로 API 를 mock — 백엔드 불필요.
      # playwright webServer 가 `npm run build && npm run start`(:13805)로 앱을 띄운다.
      # mocked config가 API/Grafana를 reserved .invalid origin으로 고정한다. live env는 상속하지 않는다.
      - name: Run Playwright e2e
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:13805
        run: npx playwright test

      - name: Run VWorld canvas with local tile and icon fixtures
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:13805
        run: npm run test:e2e:map-canvas

      - name: Run restore UI with isolated mocked API
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:13805
        run: npm run test:e2e:restore

      - name: Upload e2e traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
