  title: 공유 링크 생성 — 1회성 URL 배너와 목록 상태(활성·무기한)
  priority: P1
  tags: [desktop, mutating, share]
  preconditions:
    - account: test@test.com (user)
  data_sources: []
  steps:
    - 여행 목록 → '[e2e] SHR 001 …' 2026-11-20~21 생성 → 상세 진입
    - 작업 탭 '공유' → 권한 '보기 전용' → '링크 만들기'
  expected:
    - data-testid=new-share-url 배너에 '링크가 생성됐습니다. 이 주소는 지금만 표시됩니다.' + <code>{origin}/shared/{tripId}/{token}
    - "'열기' 링크 href = /shared/{tripId}/{token}, '링크 복사' 버튼 존재"
    - "share-link-list 1건: '보기 전용' · '활성' · '만료 무기한' · '철회' 버튼"
  cleanup:
