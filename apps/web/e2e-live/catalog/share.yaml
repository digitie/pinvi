    - account: test@test.com (user)
  data_sources: [map:tiles]
  steps:
    - 링크 생성 → 새 컨텍스트에서 요청 전부 기록하며 공유 페이지 열기 → 지도 idle까지 대기
  expected:
    - token을 포함한 요청 URL은 (a) 웹 host의 /shared/{id}/{token}(RSC 포함) (b) /trips/{id}/shared/{token} API 둘뿐
    - cross-origin(타일 등) 요청의 Referer에 token 없음(기본 strict-origin-when-cross-origin)
    - body innerText에 token 원문 없음
  cleanup:
    - 여행 삭제
  automation: scripted
  spec: specs/share/share-security.live.spec.ts#SHR-009
  notes: 실패 메시지는 token을 <token>으로 가린다(redact).

