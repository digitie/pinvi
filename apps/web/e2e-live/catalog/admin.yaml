- id: ADM-031
  title: [e2e] 장소 제안 승인(승격) → Map Feature 요청 큐 제출 → 사용자 검색 노출 → 되돌리기
  priority: P1
  tags: [desktop, admin, mutating, poi, search]
  preconditions:
    - 결정 필요: 비가역 작업 허용 또는 가역 경로 신설 (아래 notes)
  data_sources: [map:service-feature-requests]
  steps:
    - user: /map?suggest=128.5188,36.5392 → '[e2e] …' 이름으로 제안
    - admin: /admin/feature-requests → 검토 → 사유 → 승인(admin-fr-approve)
    - (Map 운영자) Map admin /v1/admin/feature-requests/{id}/approve 로 category/marker 지정
    - user: 검색에서 새 feature 노출 확인
    - 되돌리기
  expected:
    - PinVi 알림 '제안을 Map Feature 요청 큐에 제출했습니다.' 상태 '승인'(approved), kor_travel_map_ref.review_mode=feature_request_queue
  cleanup:
    - 불가 — 아래 참조
  automation: blocked
  notes: |
    PinVi 자체도 이 흐름을 prod 에서 돌리지 않는다: origin/main 의 apps/web/e2e/admin-feature-request-queue-live-mutating.live.ts(M04)
    는 PINVI_M04_LIVE_E2E=1 격리 paired stack + 사전 생성된 PINVI_M04_LIVE_FEATURE_REQUEST_ID 에서만 approve 를 1회 실행하고
    정리 단계가 없다(docs/runbooks/live-mutating-e2e.md §M04).
    비가역 사유(코드 근거):
    1) PinVi approve 는 suggestion.status 를 terminal 'approved' 로 바꾸고 _load_pending 이 pending 외 전이를 409 INVALID_STATE 로 막는다(apps/api/app/api/v1/admin/feature_requests.py). 사용자/관리자 어느 쪽에도 suggestion DELETE 엔드포인트가 없다(features.py 는 GET/POST 만).
    2) Map 쪽은 POST /v1/service/feature-requests 가 immutable request 행을 만들고(domain command, append-only), 거절도 terminal 'rejected' 행으로 남는다(Map routers/feature_requests.py; integration-map.md §3.6).
    3) Map 운영자 승인은 manual_request origin 의 실제 Feature 를 생성한다. 삭제 경로가 없고 PATCH /v1/admin/features/{id}/state retire 만 가능하며, reactivate 는 source 증거를 요구해 수동 feature 는 되살릴 수 없다(rest-api.md §2.5) — 즉 '되돌리기' 는 retired feature + 전이 이력을 영구히 남긴다.
    4) Map admin 승인/거절 route 는 OPERATOR 정책(Map admin BFF, SSO/IP allowlist) 이라 PinVi 브라우저 세션에서 호출할 수 없다.
    가역 대안(둘 중 결정):
    A) PinVi 측 '거절' 경로로 검토 UI 를 끝까지 태운다(ADM-032/033/034) — Map 호출 0, PinVi 에 rejected [e2e] 행과 audit 행만 잔존(일일 한도에 미산입).
    B) Map 에 e2e 네임스페이스를 둔다: '[e2e]' 접두 요청은 Map 운영 cron 이 자동 reject 하거나, PinVi approve 에 dry-run(검증만, Map 미호출) 모드를 추가한다. 둘 다 코드 변경 필요.

