- id: POI-004
  title: 주소 결과가 없는 지점(해상)에서는 이름이 필수
  priority: P2
  tags: [desktop, mutating, poi]
  preconditions:
    - account: test@test.com (user)
    - data: 서해 해상 좌표(예: 125.9E, 36.2N) 반경 200m 에 geo 후보 없음
  data_sources: [geo]
  steps:
    - 여행 생성 → 1일차 → 지도를 서해 해상으로 이동 → 우클릭
    - 주소 칸 '주소 결과 없음' 확인 → 이름 비운 채 '생성'
    - '이름을 입력하세요.' 확인 → 이름 '[e2e] 해상' → 생성
  expected:
    - 빈 이름 + 주소 없음 → 오류 '이름을 입력하세요.' 와 포커스가 이름 칸
    - 이름 입력 후 생성 성공, snapshot 에 address 없음
  cleanup:
    - 장소 삭제 → 여행 삭제
  automation: manual
  notes: Playwright 로 지도를 특정 좌표까지 정확히 패닝할 공개 핸들이 없다(maplibre 인스턴스 비노출). 지도 drag 로 근사 가능하나 flaky — 수동.

