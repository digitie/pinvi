name: api

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api.yml'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api.yml'
  # T-VN-H07D: vendored 스냅샷이 kor-travel-map main보다 뒤처졌는지 매일 비차단으로 확인한다.
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

concurrency:
  # event를 key에 포함한다 — schedule/push 모두 refs/heads/main으로 평가돼 같은 그룹에 들어가면
  # 매일 도는 staleness run과 머지 후 run이 서로를 취소해 신호가 조용히 사라진다.
  group: api-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    # 예약 실행은 staleness 확인이 목적이라 전체 suite는 돌리지 않는다.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_USER: pinvi
          POSTGRES_PASSWORD: pinvi_ci_password
          POSTGRES_DB: pinvi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pinvi -d pinvi_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

      - name: mypy --strict
        run: mypy --strict app

      - name: pytest (unit)
        env:
          PINVI_JWT_SECRET_KEY: pinvi-ci-jwt-secret-32-bytes-minimum-aaaa
          PINVI_DATABASE_URL: postgresql+asyncpg://pinvi:pinvi_ci_password@localhost:5432/pinvi_ci
        run: pytest tests/unit -q

      - name: Alembic migration sanity (PostGIS 컨테이너에 실제 적용)
        env:
          PINVI_JWT_SECRET_KEY: pinvi-ci-jwt-secret-32-bytes-minimum-aaaa
          PINVI_DATABASE_URL: postgresql+asyncpg://pinvi:pinvi_ci_password@localhost:5432/pinvi_ci
        run: alembic upgrade head

      - name: pytest (integration)
        env:
          PINVI_JWT_SECRET_KEY: pinvi-ci-jwt-secret-32-bytes-minimum-aaaa
          PINVI_DATABASE_URL: postgresql+asyncpg://pinvi:pinvi_ci_password@localhost:5432/pinvi_ci
        run: pytest tests/integration -q

  # T-VN-H07D: vendored 스냅샷의 live-compare가 sibling 체크아웃 부재로 CI에서 skip되어
  # 항상 green이던 맹점을 없앤다. kor-travel-map을 **핀 커밋**으로 체크아웃해 실제로 비교한다.
  #
  # 이름 주의: 이 job이 증명하는 것은 **핀↔vendored 자기정합**(수기 graft, 재-vendor 없이
  # 핀만 올린 경우를 잡는다)이지 "최신인가"가 아니다. 핀 자체가 뒤처졌는지는 구조상 알 수 없고,
  # 그건 아래 `contract-staleness`(Map main 비교)가 담당한다.
  contract-pin-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned kor-travel-map commits
        id: pins
        run: |
          user_pin=$(grep -oP '_UPSTREAM_COMMIT = "\K[0-9a-f]{40}' \
            apps/api/tests/unit/test_kor_travel_map_contract.py)
          admin_pin=$(grep -oP '_UPSTREAM_COMMIT = "\K[0-9a-f]{40}' \
            apps/api/tests/unit/test_kor_travel_map_admin_contract.py)
          service_pin=$(grep -oP '_ARTIFACT_COMMIT = "\K[0-9a-f]{40}' \
            apps/api/tests/unit/test_kor_travel_map_cache_target_contract.py)
          service_owner=$(grep -oP '_FUNCTIONAL_OWNER_COMMIT = "\K[0-9a-f]{40}' \
            apps/api/tests/unit/test_kor_travel_map_cache_target_contract.py)
          source_pin=$(grep -oP '_UPSTREAM_MAP_COMMIT = "\K[0-9a-f]{40}' \
            apps/api/tests/unit/test_cache_target_contract.py)
          alias_pin=$(grep -oP '_UPSTREAM_MAP_COMMIT = "\K[0-9a-f]{40}' \
            apps/api/tests/unit/test_feature_alias_contract.py)
          echo "user_pin=$user_pin" >> "$GITHUB_OUTPUT"
          echo "admin_pin=$admin_pin" >> "$GITHUB_OUTPUT"
          echo "service_pin=$service_pin" >> "$GITHUB_OUTPUT"
          echo "service_owner=$service_owner" >> "$GITHUB_OUTPUT"
          echo "source_pin=$source_pin" >> "$GITHUB_OUTPUT"
          echo "alias_pin=$alias_pin" >> "$GITHUB_OUTPUT"
          echo "user=$user_pin admin=$admin_pin service=$service_pin owner=$service_owner source=$source_pin alias=$alias_pin"

      - name: Checkout kor-travel-map at the user-surface pin
        uses: actions/checkout@v4
        with:
          repository: digitie/kor-travel-map
          ref: ${{ steps.pins.outputs.user_pin }}
          path: .ktm-user-pin

      - name: Checkout kor-travel-map at the admin-surface pin
        uses: actions/checkout@v4
        with:
          repository: digitie/kor-travel-map
          ref: ${{ steps.pins.outputs.admin_pin }}
          path: .ktm-admin-pin

      - name: Checkout kor-travel-map at the service-surface pin
        uses: actions/checkout@v4
        with:
          repository: digitie/kor-travel-map
          ref: ${{ steps.pins.outputs.service_pin }}
          path: .ktm-service-pin

      - name: Checkout kor-travel-map at the service functional owner
        uses: actions/checkout@v4
        with:
          repository: digitie/kor-travel-map
          ref: ${{ steps.pins.outputs.service_owner }}
          fetch-depth: 0
          path: .ktm-service-owner

      - name: Checkout kor-travel-map at the cache-target source pin
        uses: actions/checkout@v4
        with:
          repository: digitie/kor-travel-map
          ref: ${{ steps.pins.outputs.source_pin }}
          path: .ktm-cache-target-source-pin

      - name: Checkout kor-travel-map at the feature-alias-map pin
        uses: actions/checkout@v4
        with:
          repository: digitie/kor-travel-map
          ref: ${{ steps.pins.outputs.alias_pin }}
          path: .ktm-feature-alias-pin

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # user 표면: vendored 전체 파일이 핀 커밋 원본과 byte 동일해야 한다.
      - name: user snapshot byte equality vs pinned commit
        run: |
          diff -q \
            apps/api/tests/contract/kor-travel-map-openapi-user.json \
            .ktm-user-pin/packages/kor-travel-map-api/openapi.user.json

      # admin 표면: 결정적 추출을 다시 돌려 vendored subset과 비교한다.
      - name: admin subset re-extraction matches vendored file
        run: |
          python apps/api/scripts/vendor_kor_travel_map_admin_snapshot.py \
            --source .ktm-admin-pin/packages/kor-travel-map-api/openapi.json \
            --output apps/api/tests/contract/kor-travel-map-openapi-admin-detail-snapshot.json \
            --check

      - name: service snapshot byte equality vs pinned commit
        run: |
          diff -q \
            apps/api/tests/contract/kor-travel-map-openapi-service.json \
            .ktm-service-pin/packages/kor-travel-map-api/openapi.service.json

      - name: service artifact is an ancestor of the functional owner
        run: |
          git -C .ktm-service-owner merge-base --is-ancestor \
            "${{ steps.pins.outputs.service_pin }}" \
            "${{ steps.pins.outputs.service_owner }}"

      - name: cache-target source bytes equal the pinned commit
        run: |
          diff -q \
            apps/api/tests/contract/cache-target-source-v1-golden.json \
            .ktm-cache-target-source-pin/contracts/cache-target-source-v1-golden.json

      # T-VN-32C: alias-map golden은 양 저장소 독립 구현이 같은 shared vector를
      # 검증한다 — vendored bytes가 핀 커밋 원본과 byte 동일해야 한다.
      - name: feature-alias-map golden bytes equal the pinned commit
        run: |
          diff -q \
            apps/api/tests/contract/feature-alias-map-v1-golden.json \
            .ktm-feature-alias-pin/contracts/feature-alias-map-v1-golden.json

  # staleness 신호: 핀이 Map main보다 뒤처졌는지 매일 확인한다. `if:` 가드로 PR/push에는 아예
  # 돌지 않으므로 PR을 막지 않는다(막으면 Map의 무관한 OpenAPI 변경마다 Pinvi PR이 red가 된다).
  # `continue-on-error`는 쓰지 않는다 — job을 실패로 남겨야 예약 workflow 실패 알림이 가고,
  # H07B에서 스냅샷이 174 commits 뒤처진 걸 뒤늦게 발견한 종류의 드리프트가 실제로 사람에게 닿는다.
  contract-staleness:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: digitie/kor-travel-map
          ref: main
          path: .ktm-main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Report vendored-vs-main drift
        run: |
          status=0
          if ! diff -q apps/api/tests/contract/kor-travel-map-openapi-user.json \
                       .ktm-main/packages/kor-travel-map-api/openapi.user.json; then
            echo "::warning::user 스냅샷이 kor-travel-map main과 다르다 — 재-vendor 필요"
            status=1
          fi
          if ! python apps/api/scripts/vendor_kor_travel_map_admin_snapshot.py \
                 --source .ktm-main/packages/kor-travel-map-api/openapi.json \
                 --output apps/api/tests/contract/kor-travel-map-openapi-admin-detail-snapshot.json \
                 --check; then
            echo "::warning::admin subset이 kor-travel-map main과 다르다 — 재-vendor 필요"
            status=1
          fi
          if ! diff -q apps/api/tests/contract/kor-travel-map-openapi-service.json \
                       .ktm-main/packages/kor-travel-map-api/openapi.service.json; then
            echo "::warning::service 스냅샷이 kor-travel-map main과 다르다 — 재-vendor 필요"
            status=1
          fi
          # T-VN-32C: shared golden 2종도 같은 드리프트 감시에 넣는다 — Map이 벡터를
          # 개정(예: 0083 nonderived_v1 추가)했는데 PinVi가 옛 사본으로 검증하는 맹점 방지.
          if ! diff -q apps/api/tests/contract/feature-alias-map-v1-golden.json \
                       .ktm-main/contracts/feature-alias-map-v1-golden.json; then
            echo "::warning::feature-alias-map golden이 kor-travel-map main과 다르다 — 재-vendor 필요"
            status=1
          fi
          if ! diff -q apps/api/tests/contract/cache-target-source-v1-golden.json \
                       .ktm-main/contracts/cache-target-source-v1-golden.json; then
            echo "::warning::cache-target-source golden이 kor-travel-map main과 다르다 — 재-vendor 필요"
            status=1
          fi
          if [ "$status" = 0 ]; then
            echo "vendored 스냅샷이 kor-travel-map main과 일치한다"
          fi
          exit "$status"
