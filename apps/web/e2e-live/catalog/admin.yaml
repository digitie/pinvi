# AREA: admin (prefix ADM) — PinVi prod admin console, live e2e catalog
# Source of truth for selectors/texts: PinVi origin/main b1cef056 (2026-11-03, #619) read via `git show origin/main:<path>` —
#   the F:\dev\pinvi working tree is an older branch (a07257e7). See README §Citations / §Re-verification.
# Accounts: user = PINVI_E2E_USER_EMAIL/PASSWORD (test@test.com), ordinary-user for role-gate cases = PINVI_E2E_USER2_* (test2@test.com,
#   falls back to USER), admin = PINVI_E2E_ADMIN_EMAIL/PASSWORD (fixed admin). Env only.
# Admin login form (origin/main) = @kor-travel/ui LoginForm: [data-slot=login-username|login-password|login-submit|login-error],
#   wrapper data-testid="admin-login"; the older admin-login-email/password/submit/error test ids no longer exist.
# IMPORTANT facts that reshape the brief (details in README):
#   - Non-admin on admin API => HTTP 404 RESOURCE_NOT_FOUND (PinVi hides existence, rbac.py SPEC V8 M-4), NOT 403.
#     Admin UI => redirect to /admin/login?reason=forbidden with alert "관리자 권한이 필요합니다."
#   - "POI 승격" = Feature 제안(feature_suggestion) approve -> Map POST /v1/service/feature-requests (immutable queue).
#     Both PinVi outcomes (approved / rejected) are terminal; there is NO delete for suggestions (user or admin).
#     Full promotion is therefore irreversible from PinVi => ADM-031 blocked; reversible exercises = ADM-032/033/034.

- id: ADM-001
  title: 관리자 계정으로 /admin/login 로그인 후 대시보드 진입과 사이드바 사용자 표시
  priority: P1
  tags: [desktop, admin, auth]
  preconditions:
    - account: fixed PinVi admin (env PINVI_E2E_ADMIN_EMAIL / PINVI_E2E_ADMIN_PASSWORD)
    - env: PLAYWRIGHT_BASE_URL = https://pinvi.digitie.mywire.org
  data_sources: []
  steps:
    - /admin/login 진입 → [data-slot=login-username] / [data-slot=login-password] 입력 → [data-slot=login-submit]
    - /admin 으로 이동 확인
  expected:
    - URL 이 /admin 으로 바뀐다
    - 사이드바(admin-sidebar) 가 보이고 admin-me 의 aria-label 이 '로그인 사용자 <admin email>' 이다 (값은 env 와 비교만, 로그 금지)
    - admin-nav--admin-feature-requests / -features / -dedup-review / -integrity / -audit 링크가 있다
  cleanup:
    - 없음 (read-only)
  automation: scripted
  spec: specs/admin/admin-auth.live.spec.ts#ADM-001
  notes: 로그인 성공 조건은 roles ∩ {admin, operator, cpo} ≠ ∅ (admin/login/page.tsx ADMIN_ROLES).

