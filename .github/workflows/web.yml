name: web

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/web.yml'

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Web 검사는 merge ref가 아니라 exact PR head를 검증한다.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (workspaces)
        run: npm run lint

      - name: Typecheck (workspaces)
        run: npm run typecheck

      # 루트 test는 `--workspaces --if-present`라 apps/web + packages/{domain,schemas}를 모두 돈다.
      # 이전에는 @pinvi/web만 호출해 packages의 24파일 104테스트가 CI에서 한 번도 실행되지 않았다(T-321).
      - name: Unit tests (workspaces)
        run: npm test

      - name: Build (workspaces)
        env:
          NEXT_PUBLIC_PINVI_API_URL: http://localhost:12801
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # T-323: aggregate-ci.yml waits for this exact GitHub Actions check on Web changes.
    steps:
      - uses: actions/checkout@v4
        with:
          # live E2E도 lint/build와 동일한 exact PR head를 사용한다.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # 모든 e2e 는 page.route 로 API 를 mock — 백엔드 불필요.
      # playwright webServer 가 `npm run build && npm run start`(:12805)로 앱을 띄운다.
      # API URL 은 12801(lib/api 기본값) — admin e2e mock 이 port 12801 을 exact-match 하므로 일치 필수.
      - name: Run Playwright e2e
        working-directory: apps/web
        env:
          NEXT_PUBLIC_PINVI_API_URL: http://localhost:12801
        run: npx playwright test

      - name: Upload e2e traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
