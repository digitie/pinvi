- id: TRIP-010
  title: 장소가 있는 상태에서 기간 축소/확장 — 기간 벗어남 배지와 일자 추가 상한
  priority: P1
  tags: [desktop, mobile, mutating, search]
  preconditions:
    - account: test@test.com (user)
    - data: Map has 안동하회마을 feature
  data_sources: [map:heritage, geo]
  steps:
    - 새 여행 D+30 ~ D+31 → 2일차에 '안동하회마을' 검색·추가
    - '편집' → 종료일을 D+30으로 축소 → 저장
    - '편집' → 종료일을 D+32로 확장 → 저장
  expected:
    - 축소 후: 2일차 탭 유지 + '기간 벗어남' 배지, 헤더 '2일 · 1개 장소', 일자 추가 비활성 '최대 1일'
    - 확장 후: 배지 사라짐, '3일차 추가' 활성, 2일차 장소 1개 그대로
  cleanup:
    - afterEach deleteTrip(id)
  automation: scripted
  spec: specs/trip/trip-create.live.spec.ts#TRIP-010
  notes: ADR-055 F1 — 기간 축소는 일자를 지우지 않고 out_of_range만 표시.

- id: TRIP-011
  title: 편집 다이얼로그에서 종료일 < 시작일 — 종료일 필드 안내로 거부, API도 422
  priority: P3
  tags: [desktop, mobile, mutating]
  preconditions:
    - account: test@test.com (user)
  data_sources: []
  steps:
    - 새 여행 D+40 ~ D+41 → '편집' → 시작일 D+45, 종료일 D+41 → 저장
    - 같은 기간을 API로 PATCH(If-Match 현재 version)
  expected:
    - 다이얼로그가 열린 채 종료일 필드 aria-invalid + '종료일은 시작일 이후여야 합니다.', PATCH 요청 0건
    - API PATCH /trips/{id} → 422, error.message '종료일은 시작일 이후여야 합니다.'
    - 여행 기간은 바뀌지 않는다
  cleanup:
    - afterEach deleteTrip(id)
  automation: scripted
  spec: specs/trip/trip-create.live.spec.ts#TRIP-011
  notes: '#624 — #654(API 422) + #643 리뷰 PR(다이얼로그 필드 검증·한국어 안내)로 수정. test.fail 제거, 정상 단언.'

