# Pinvi DEV compose — PostgreSQL/PostGIS + RustFS + (옵션) Dagster.
# `docs/runbooks/local-dev.md` §8.
#
# dev 기본 네트워크는 **host 모드**(ADR-047): 컨테이너가 호스트 net을 공유해 127.0.0.1의
# 12xxx 고정 포트로 직접 bind한다(포트 remap·서비스 DNS 없음 → 내부 주소는 127.0.0.1:port).
# observability profile(cadvisor/prometheus/grafana)은 metric 스크레이프 타겟 때문에 bridge
# 유지. prod는 이 파일이 아니라 ktdctl + 공식 도메인으로 올린다.

services:
  postgres:
    image: postgis/postgis:16-3.5-alpine
    restart: unless-stopped
    network_mode: host          # → 127.0.0.1:5432
    environment:
      POSTGRES_USER: pinvi
      POSTGRES_PASSWORD: pinvi_dev_password
      POSTGRES_DB: pinvi
    volumes:
      - pinvi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinvi -d pinvi"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    network_mode: host          # → 127.0.0.1:12101 (API) / :12105 (console)
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_VOLUMES: /data
      # host 모드라 remap이 없으므로 12xxx 고정 포트로 직접 bind한다.
      RUSTFS_ADDRESS: ":12101"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":12105"
    volumes:
      - pinvi-rustfs:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:12101/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs-init:
    # MinIO가 Docker Hub에서 `minio/mc`를 내렸다(2026-09-27 n150 실측: 저장소 404 — digest 핀도 받을 수
    # 없다). 버킷은 rustfs 서비스와 같은 이미지에 이미 든 curl의 SigV4로 만든다.
    image: rustfs/rustfs:latest
    network_mode: host          # host net이라 rustfs DNS 대신 127.0.0.1:12101
    depends_on:
      rustfs:
        condition: service_healthy
    # 이미 있는 버킷은 200(RustFS) 또는 409 BucketAlreadyOwnedByYou(S3)로 멱등이다. 접속 실패·5xx만
    # 재시도한다 — RustFS는 health가 200이 된 뒤에도 잠시 `503 waiting for storage_quorum`을 돌려준다
    # (2026-09-27 n150 실측 약 1.7초). 그 밖의 응답은 실패다 — 자격증명·이름 오류를 성공으로 삼키지 않는다.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        tries=0
        while :; do
          rm -f /tmp/rustfs-init.out
          code=$$(curl -sS --connect-timeout 5 --max-time 30 -o /tmp/rustfs-init.out -w '%{http_code}' \
            --aws-sigv4 aws:amz:us-east-1:s3 --user rustfsadmin:rustfsadmin \
            -X PUT http://127.0.0.1:12101/pinvi-media) || code=000
          case "$$code" in
            200) exit 0 ;;
            409) grep -q BucketAlreadyOwnedByYou /tmp/rustfs-init.out && exit 0 ;;
            000|5??) tries=$$((tries + 1)); if [ "$$tries" -lt 60 ]; then sleep 2; continue; fi ;;
          esac
          echo "rustfs-init: bucket pinvi-media: HTTP $$code" >&2
          if [ -s /tmp/rustfs-init.out ]; then cat /tmp/rustfs-init.out >&2; fi
          exit 1
        done

  # Dagster instance storage database. 앱 DB(`pinvi`)와 같은 database는 쓸 수 없다 —
  # dagster-postgres의 `alembic_version`이 PinVi Alembic의 것과 충돌한다(apps/etl/dagster.yaml).
  # dev는 앱도 bootstrap superuser로 붙으므로 database만 가른다. 격리 login·검증은
  # infra/docker-compose.app.yml의 app-dagster-db-init이 맡는다.
  dagster-db-init:
    profiles: ["etl"]
    image: postgis/postgis:16-3.5-alpine
    network_mode: host
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: pinvi
      PGPASSWORD: pinvi_dev_password
      PGDATABASE: pinvi
    # 존재 확인만 조용히 한다. `createdb ... || true`는 인증 실패·연결 거부까지 성공으로 삼킨다.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        exists=$$(psql --no-psqlrc -tAc "SELECT 1 FROM pg_database WHERE datname = 'pinvi_dagster'")
        if [ "$$exists" != "1" ]; then
          createdb --template=template0 pinvi_dagster
        fi

  # Sprint 5에서 활성화. Sprint 1은 컨테이너 정의만.
  dagster:
    profiles: ["etl"]
    build:
      context: ..
      dockerfile: apps/etl/Dockerfile
    restart: unless-stopped
    network_mode: host          # webserver는 127.0.0.1:12802로 bind(apps/etl/Dockerfile)
    depends_on:
      postgres:
        condition: service_healthy
      dagster-db-init:
        condition: service_completed_successfully
    environment:
      # host net이라 서비스 DNS 대신 127.0.0.1 사용.
      PINVI_DATABASE_URL: postgresql+asyncpg://pinvi:pinvi_dev_password@127.0.0.1:5432/pinvi
      # instance storage(run/event log/schedule). apps/etl/dagster.yaml이 이 env를 읽는다.
      PINVI_DAGSTER_PG_URL: postgresql://pinvi:pinvi_dev_password@127.0.0.1:5432/pinvi_dagster
      PINVI_RUSTFS_ENDPOINT_URL: http://127.0.0.1:12101
      PINVI_RUSTFS_BUCKET: pinvi-media
      PINVI_RUSTFS_ACCESS_KEY_ID: rustfsadmin
      PINVI_RUSTFS_SECRET_ACCESS_KEY: rustfsadmin
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
      PINVI_KASI_SPECIAL_DAYS_LOOKBACK_MONTHS: ${PINVI_KASI_SPECIAL_DAYS_LOOKBACK_MONTHS:-6}
      PINVI_KASI_SPECIAL_DAYS_LOOKAHEAD_MONTHS: ${PINVI_KASI_SPECIAL_DAYS_LOOKAHEAD_MONTHS:-18}
      # 이미지에 구운 dagster.yaml이 있는 자리다. 종전 값(/opt/pinvi/.tmp/dagster)에는
      # dagster.yaml이 없어 instance가 PINVI_DAGSTER_PG_URL 없이도 SQLite로 떴다 — #558이 닫은
      # 경로가 dev에만 열려 있었다.
      DAGSTER_HOME: /opt/pinvi/.dagster
    volumes:
      - ../apps/etl:/opt/pinvi/apps/etl
      # DAGSTER_HOME이 아니라 그 아래 storage(compute log·local artifact)에만 붙인다 —
      # DAGSTER_HOME에 붙이면 구운 dagster.yaml을 볼륨 사본이 가린다.
      - pinvi-dagster:/opt/pinvi/.dagster/storage

  cadvisor:
    profiles: ["observability"]
    image: ${PINVI_CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.52.1}
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    ports:
      - "${PINVI_CADVISOR_PORT:-12301}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  blackbox:
    profiles: ["observability"]
    image: ${PINVI_BLACKBOX_IMAGE:-prom/blackbox-exporter:v0.25.0}
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

  prometheus:
    profiles: ["observability"]
    image: ${PINVI_PROMETHEUS_IMAGE:-prom/prometheus:v2.53.1}
    restart: unless-stopped
    user: "${PINVI_PROMETHEUS_RUN_AS_USER:-0}"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PINVI_PROMETHEUS_PORT:-12401}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - pinvi-prometheus:/prometheus
    depends_on:
      cadvisor:
        condition: service_started
      blackbox:
        condition: service_started

  grafana:
    profiles: ["observability"]
    image: ${PINVI_GRAFANA_IMAGE:-grafana/grafana:11.1.4}
    restart: unless-stopped
    user: "${PINVI_GRAFANA_RUN_AS_USER:-0}"
    environment:
      GF_SECURITY_ADMIN_USER: ${PINVI_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${PINVI_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: ${NEXT_PUBLIC_GRAFANA_URL:-http://127.0.0.1:${PINVI_GRAFANA_PORT:-12205}}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${PINVI_GRAFANA_PORT:-12205}:3000"
    volumes:
      - pinvi-grafana:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

volumes:
  pinvi-pgdata:
  pinvi-rustfs:
  pinvi-dagster:
  pinvi-prometheus:
  pinvi-grafana:
