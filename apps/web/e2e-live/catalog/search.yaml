# AREA: search (SRCH) — place search + POI detail card + explore map, PinVi prod live.
# Schema: see ../SPEC.md. UI text/selectors cited from PinVi apps/web (see README.md §Sources).
# Category family labels: kor-travel-map src/kortravelmap/category/_definitions.py (leaf names such as
# 한옥·민속마을 / 커피전문점 / 주차장 are what PinVi shows via `category_label`).
#
# Facts that shape the assertions (PinVi #614/#615, worktrees pinvi-claude-search / pinvi-claude-bias):
# - GET /search?q&limit=8&bbox=lng_min,lat_min,lng_max,lat_max — bbox is an ORDER-ONLY bias: features inside
#   the bbox are pulled to the front, at most limit//2 (=4), rest keep Map order. Trip page: bbox = trip POI
#   extent + 0.25°; /map: bbox = current viewport (2-decimal). Never sent to Kakao/Naver.
# - feature rows have no address; secondary line = category_label. address rows = geo v2 address.full.
# - detail card: `-category` shows category_label (leaf), subtitle = `category_label · address_line`.

# ───────────────────────── A. basic search (explore map search box, read-only) ─────────────────────────
- id: SRCH-001
  title: 탐색 지도에서 2글자 검색('설악') → 8초 내 결과 목록 + 소스 배지
  priority: P1
  tags: [desktop, mobile, search, perf]
  preconditions:
    - account: test@test.com (user)
    - data: Map has 설악산 features (national park / hiking trail)
  data_sources: [map:park, map:hiking-trail, geo]
  steps:
    - 로그인 → /map → '장소·주소 검색' 입력란에 '설악' 입력
    - GET /search?q=설악 응답 대기(요청에 limit=8, bbox=화면 범위)
  expected:
    - 8초 이내 결과 ul 표시, 각 행에 이름 + 배지('장소'|'주소'|'내 여행'|'카카오'|'네이버 검색')
    - 응답 시간을 test annotation에 기록(soft < 8000ms)
  cleanup: [읽기 전용]
  automation: scripted
  spec: specs/search/search-basic.live.spec.ts#SRCH-001

