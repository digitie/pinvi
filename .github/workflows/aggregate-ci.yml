name: Aggregate CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: aggregate-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  aggregate:
    name: Aggregate CI gate
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Wait for required path checks
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const changed = files.flatMap((file) =>
              [file.filename, file.previous_filename].filter(Boolean),
            );
            const hasAny = (predicates) => changed.some((path) => predicates.some((predicate) => predicate(path)));
            const startsWith = (prefix) => (path) => path.startsWith(prefix);
            const equals = (target) => (path) => path === target;

            const requiredChecks = [];
            if (hasAny([
              startsWith("apps/api/"),
              startsWith("contracts/"),
              equals(".github/workflows/api.yml"),
              equals("pyproject.toml"),
            ])) {
              requiredChecks.push("lint-typecheck-test");
              requiredChecks.push("docker-provenance-image");
              // kor-travel-map 계약 스냅샷의 핀↔vendored 정합 게이트.
              // `Aggregate CI gate`가 유일한 required check이므로 여기에 넣지 않으면
              // job이 red여도 머지가 막히지 않는다(= 과거 항상-skip 테스트와 같은 강도).
              requiredChecks.push("contract-pin-consistency");
            }
            if (hasAny([
              startsWith("apps/web/"),
              startsWith("packages/"),
              equals("package.json"),
              equals("package-lock.json"),
              equals("tsconfig.base.json"),
              equals(".github/workflows/web.yml"),
            ])) {
              requiredChecks.push("lint-typecheck-build");
              // Web Playwright는 lint/build와 별개 job이다. Aggregate gate가 유일한
              // required check이므로 여기서 기다리지 않으면 E2E 실패가 merge를 막지 못한다(T-323).
              requiredChecks.push("e2e");
            }
            if (hasAny([
              startsWith("apps/mobile/"),
              startsWith("packages/"),
              equals("package.json"),
              equals("package-lock.json"),
              equals("tsconfig.base.json"),
              equals(".github/workflows/mobile.yml"),
            ])) {
              requiredChecks.push("mobile-typecheck");
              requiredChecks.push("mobile-lint");
            }
            if (hasAny([
              startsWith("apps/etl/"),
              equals(".github/workflows/etl.yml"),
            ])) {
              requiredChecks.push("sanity");
            }

            core.info(`Changed files: ${changed.join(", ") || "(none)"}`);
            core.info(`Required path checks: ${requiredChecks.join(", ") || "(none)"}`);
            if (requiredChecks.length === 0) {
              core.info("No path-filtered CI checks are required for this PR.");
              return;
            }

            const deadline = Date.now() + 10 * 60 * 1000;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            while (true) {
              const runs = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref: headSha,
                per_page: 100,
              });
              const byName = new Map();
              for (const run of runs) {
                if (run.head_sha !== headSha || run.app?.slug !== "github-actions") {
                  continue;
                }
                const previous = byName.get(run.name);
                if (!previous || run.id > previous.id) {
                  byName.set(run.name, run);
                }
              }
              const pending = [];

              for (const name of requiredChecks) {
                const run = byName.get(name);
                if (!run) {
                  pending.push(`${name}: missing`);
                  continue;
                }
                if (run.status !== "completed") {
                  pending.push(`${name}: ${run.status}`);
                  continue;
                }
                if (run.conclusion !== "success") {
                  core.setFailed(`${name} concluded with ${run.conclusion}`);
                  return;
                }
              }

              if (pending.length === 0) {
                core.info("All required path-filtered checks passed.");
                return;
              }
              if (Date.now() > deadline) {
                core.setFailed(`Timed out waiting for checks: ${pending.join(", ")}`);
                return;
              }

              core.info(`Waiting for checks: ${pending.join(", ")}`);
              await sleep(20 * 1000);
            }
