name: uv-lock-refresh

# Python 의존성은 `uv.lock`에서만 설치된다(api.yml `uv sync --locked`, etl.yml·두 Dockerfile
# `uv export --locked`). 그래서 upstream 릴리스가 CI·이미지를 저절로 바꾸지 않는다 — 대신
# 의존성은 이 workflow가 만드는 갱신 브랜치를 사람이 PR로 열어 CI를 통과시킬 때만 앞으로 간다.
#
# GitHub Actions는 이 저장소에서 PR을 만들 수 없고(저장소 설정), GITHUB_TOKEN이 연 PR은 CI를
# 띄우지도 않는다. 그래서 브랜치만 밀고, PR은 사람이 연다(요약에 명령을 남긴다).
# 절차와 수동 실행법: docs/dev-environment.md "Python 의존성 — uv.lock".

on:
  schedule:
    # 매주 월요일 06:41 KST.
    - cron: '41 21 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uv-lock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRANCH: deps/uv-lock-refresh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # uv 버전은 api.yml·두 Dockerfile·두 pyproject `required-version`과 같다
      # (API 쪽과 이 파일은 apps/api/tests/unit/test_api_dependency_lock.py,
      #  ETL 쪽은 apps/etl/tests/test_dagster_version_lock.py가 묶는다).
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.11.21'

      - name: apps/api — uv lock --upgrade
        working-directory: apps/api
        run: uv lock --upgrade

      # 공유 Dagster plane에서 code-server는 host(webserver/daemon)보다 새 dagster를 돌리면 안 된다
      # (apps/etl/pyproject.toml). Dagster 계열은 지금 lock 버전에 붙잡아 두고 나머지만 올린다 —
      # Dagster는 host와 맞춰 `uv lock --upgrade-package dagster==<ver> ...`로 따로 올린다.
      - name: apps/etl — uv lock --upgrade (Dagster 계열 유지)
        working-directory: apps/etl
        run: |
          python3 - > "$RUNNER_TEMP/dagster-held.txt" <<'PY'
          import tomllib

          with open("uv.lock", "rb") as handle:
              lock = tomllib.load(handle)
          for package in lock["package"]:
              if package["name"].startswith("dagster") and "version" in package:
                  print(f"{package['name']}=={package['version']}")
          PY
          test -s "$RUNNER_TEMP/dagster-held.txt"
          uv lock --upgrade
          args=()
          while read -r held; do args+=(--upgrade-package "$held"); done < "$RUNNER_TEMP/dagster-held.txt"
          uv lock "${args[@]}"
          python3 - "$RUNNER_TEMP/dagster-held.txt" <<'PY'
          import sys
          import tomllib

          with open("uv.lock", "rb") as handle:
              lock = tomllib.load(handle)
          now = {
              f"{p['name']}=={p['version']}"
              for p in lock["package"]
              if p["name"].startswith("dagster") and "version" in p
          }
          with open(sys.argv[1], encoding="utf-8") as handle:
              held = set(handle.read().split())
          assert now == held, f"Dagster 계열이 움직였다: 전={sorted(held)} 후={sorted(now)}"
          PY

      - name: Push the refresh branch
        run: |
          if git diff --quiet -- apps/api/uv.lock apps/etl/uv.lock; then
            echo "두 uv.lock 모두 이미 최신이다 — 갱신 브랜치를 만들지 않는다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add apps/api/uv.lock apps/etl/uv.lock
          git commit -m "chore(deps): refresh uv.lock (uv lock --upgrade)"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          {
            echo "## uv.lock 갱신 브랜치 \`$BRANCH\`"
            echo
            echo '```'
            git diff --stat HEAD~1 HEAD
            echo '```'
            echo
            echo "PR은 사람이 연다(그래야 CI가 돈다):"
            echo
            echo '```'
            echo "gh pr create -R $GITHUB_REPOSITORY --base main --head $BRANCH --fill"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
