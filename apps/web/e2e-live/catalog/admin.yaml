  data_sources: [map:admin-proxy, pinvi:feature-suggestions]
  steps:
    - 수정·폐쇄 승인 응답 유실 뒤 저장 입력/키/actor와 거절 잠금을 확인
    - 별도 확인 사유 입력 → Map 실행 기록 확인 → 확인창의 안전한 초기 포커스 → 확정
    - 완료는 반영, 미실행은 기존 키 영구 봉인 뒤 재검토·새 승인 또는 거절
  expected:
    - 실제 Map 완료 receipt를 검증한 경우만 added
    - 미실행 응답 유실·재확인은 같은 봉인 결과와 동일 next 키를 보존
    - 새 승인만 별도 키를 사용하고 지연된 옛 승인·조정은 409
    - 처리 중·인증/계약 실패는 dispatch와 잠금을 유지
