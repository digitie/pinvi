[project]
name = "pinvi-etl"
version = "0.1.0"
description = "Pinvi Dagster code location — Sprint 5에서 본격 활성화 (ADR-006)."
requires-python = ">=3.12"

# 여기 값은 하한이다. 이미지가 실제로 설치하는 정확한 버전은 `uv.lock`이
# 정본이다(Dockerfile이 `uv export --locked`로 lock에서만 설치한다). Dagster를
# 올릴 때는 `uv lock --upgrade-package dagster==<ver> ...`로 lock을 갱신한다 —
# 공유 Dagster plane에서 code-server는 host보다 새 dagster를 돌리면 안 된다.
dependencies = [
  "dagster>=1.9",
  "dagster-webserver>=1.9",
  # instance storage를 PostgreSQL로 둔다(`apps/etl/dagster.yaml`).
  # 이 패키지가 없으면 Dagster가 조용히 SQLite로 떨어지고, 그 SQLite는
  # DAGSTER_HOME에 볼륨이 없어 컨테이너 재생성마다 사라진다.
  "dagster-postgres>=0.25",
  # 2.1.0은 bare postgresql:// URL의 기본 driver 선택을 psycopg2에서 psycopg(v3)로
  # 바꿔, psycopg2만 설치된 dagster-postgres 동기 연결(ModuleNotFoundError: psycopg)을
  # 깬다 — psycopg2는 여전히 설치돼 있지만 더 이상 선택되지 않는다.
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30",
  "httpx>=0.27",
  "python-kasi-api @ git+https://github.com/digitie/python-kasi-api.git@bc8fd49349212f840f58fe1a602bf77b2aaa1669",
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["pinvi"]

[tool.uv]
# lock을 만들고 푸는 uv를 하나로 묶는다 — Dockerfile의 `ghcr.io/astral-sh/uv` 태그,
# CI(`.github/workflows/etl.yml`)의 setup-uv 버전과 같아야 한다
# (`tests/test_dagster_version_lock.py`가 셋을 묶는다).
required-version = "==0.11.21"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.dagster]
module_name = "pinvi.etl.definitions"
