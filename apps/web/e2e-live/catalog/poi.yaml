# AREA: poi — 없던 곳 POI 추가(my-POI / manual) + 첨부 파일
# PinVi main a07257e7 기준. UI 문자열·testid 출처는 README.md 참조.
# 공통 전제: 모든 케이스는 helpers.createTrip 으로 '[e2e] POI …' 여행(날짜 지정 → 일자 자동 생성)을 만들고
#            afterEach 에서 첨부 → 여행 순으로 삭제한다. POI 첨부(trip_id=NULL)는 여행 삭제 후에도
#            /files 에 남으므로(uploaded_by 필터) 반드시 명시 삭제한다.

- id: POI-001
  title: 지도 우클릭으로 없던 곳 POI 생성 — 주소 자동 조회·이름 입력·일정/지도 반영
  priority: P1
  tags: [desktop, mutating, poi]
  preconditions:
    - account: test@test.com (user)
    - env: VWorld 타일 로드 가능(maplibregl-canvas 렌더), geo reverse 응답 가능
  data_sources: [geo]
  steps:
    - '[e2e] POI 수동' 여행(2026-11-05~06) 생성 → 상세 진입 → 1일차 탭 선택
    - 지도 캔버스 중앙 우클릭 → 'POI 생성' 다이얼로그
    - 주소 칸이 '주소 확인 중…' → 실제 주소 문자열로 바뀔 때까지 대기(aria-busy 해제)
    - 이름을 '[e2e] 수동 장소 <ts>' 로 바꿈 → '생성'
  expected:
    - 다이얼로그 닫힘, 1일차 목록(trip-poi-list)에 '[e2e] 수동 장소' 행 1개
    - 지도 마커 범례(trip-map-marker-style)에 같은 제목 1개, data-feature-resolution-state="not_linked", data-marker-color="P-08", data-marker-icon="marker"
    - 지도 통계 '장소 1곳', 일자 배지 '1곳'
    - POST /trips/{id}/pois 본문: feature_id=null, custom_marker_color=P-08, feature_snapshot.source='manual', address_label 존재
  cleanup:
    - 장소 삭제 → 여행 삭제
  automation: scripted
  spec: specs/poi/poi-create.live.spec.ts#POI-001

- id: POI-002
  title: (모바일) 지도 롱프레스로 POI 생성
  priority: P1
  tags: [mobile, mutating, poi]
  preconditions:
    - account: test@test.com (user)
    - env: 390x844 + hasTouch 프로젝트
  data_sources: [geo]
  steps:
    - 여행 생성 → 상세(모바일은 지도 우선, 패널 닫힘) → '패널 열기' → 1일차 선택 → '패널 닫기'
    - 지도 중앙에 touchstart 650ms 이상 유지 후 touchend
    - 'POI 생성' 다이얼로그에서 이름 '[e2e] 롱프레스 <ts>' → 생성
  expected:
    - 다이얼로그 노출(주소 자동 조회), 생성 후 마커 범례 1개·통계 '장소 1곳'
    - 롱프레스 중 10px 이상 이동하면 다이얼로그가 뜨지 않는다(보조 단언)
  cleanup:
    - 장소 삭제 → 여행 삭제
  automation: scripted
  spec: specs/poi/poi-create.live.spec.ts#POI-002
  notes: Playwright touchscreen.tap은 홀드가 없어 page.evaluate 로 TouchEvent 를 직접 dispatch 한다.

