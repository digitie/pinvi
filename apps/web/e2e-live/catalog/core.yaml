- id: CORE-016
  title: 타일 로드 — VWorld WMTS 200, 디코드/worker/WebGL 오류·tile-error 이벤트 없음(Firefox 데스크톱 포함)
  priority: P1
  tags: [desktop, mobile, firefox]
  preconditions:
    - account: test@test.com
    - env: VWorld 키 유효(만료 시 전부 4xx — 운영 이슈로 분류)
  data_sources: [vworld]
  steps:
    - /map → api.vworld.kr/req/wmts 응답 집계, 콘솔·vworld-tile-error 수집
  expected:
    - 200 타일 ≥1, 비200 타일 0, 디코드/worker 오류 0
  cleanup: [없음]
  automation: scripted
  spec: specs/core/core-map.live.spec.ts#CORE-016
  notes: >-
    vworld:// 프로토콜이 https로 재작성해 fetch — response 이벤트로 관측 가능. 2026-11-16 PC 바탕지도 누락:
    vworld-map-web 1.0.3 handler가 `URL.protocol` setter로 스킴을 바꿔 Firefox·Safari에서는 vworld://를 그대로
    fetch했다(타일 0건). vworld-map-web 1.0.4(upstream #33)가 스킴을 문자열로 바꿔 고쳤다. `@firefox` — `--project desktop-firefox`로
    Firefox 데스크톱에서도 돈다. 콘솔에 vworld:// 오류가 없어야 한다.

